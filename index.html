<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argus Core - Operational BI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#05080F',
                            900: '#0B0F1A',
                            800: '#161B2D',
                            700: '#1F263E'
                        },
                        brand: {
                            500: '#6366F1',
                            600: '#4F46E5',
                            accent: '#10B981'
                        }
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '2.5rem'
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #05080F;
            color: #E2E8F0;
            overflow-x: hidden;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6366F144; border-radius: 20px; }

        .glass-card {
            background: rgba(22, 27, 45, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .neon-glow {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }
        
        .tab-active {
            background: #6366F1;
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="dark">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, 
            PieChart, Pie, Cell, Label
        } = window.Recharts;

        const CHART_COLORS = ['#6366F1', '#10B981', '#F59E0B', '#F43F5E', '#8B5CF6', '#EC4899', '#0EA5E9', '#94A3B8'];

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Dashboard: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M4 5a1 1 0 011-1h4a1 1 0 011 1v5a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v2a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" /></svg>,
                Sync: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
                Grid: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
                List: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M4 6h16M4 12h16M4 18h16" /></svg>,
                Search: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
                Link: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.828a4 4 0 005.656 0l4-4a4 4 0 005.656 0l4-4a4 4 0 105.656 5.656l-1.1 1.1" /></svg>
            };
            return icons[name] || <span>?</span>;
        };

        const initialMock = [
            { id: '1', title: 'Implementar Assinatura Eletrônica', product: 'Argus Clinical', status: 'Planejado', type: 'Feature', assignee: 'CTTGabriel', sprint: '20/03' },
            { id: '2', title: 'Ajuste Cadastro de Paciente', product: 'Argus Clinical', status: 'Entregue', type: 'Correção', assignee: 'CTTGabriel', sprint: '20/03' },
            { id: '3', title: 'IA com chat aberto', product: 'Argus Experience', status: 'Em Desenvolvimento', type: 'Feature', assignee: 'oliveirafacc', sprint: '20/03' },
            { id: '4', title: 'Dashboard de Indicadores', product: 'Argus Watch', status: 'Planejado', type: 'Melhoria', assignee: 'Markinjr92', sprint: '20/03' }
        ];

        function App() {
            const [view, setView] = useState('dashboard');
            const [mode, setMode] = useState('kanban');
            const [data, setData] = useState(initialMock);
            const [sheetUrl, setSheetUrl] = useState('');
            const [syncStatus, setSyncStatus] = useState({ state: 'idle', msg: '' });
            const [searchTerm, setSearchTerm] = useState('');
            const [barType, setBarType] = useState('stacked'); // 'stacked' or 'grouped'

            // Funções de Processamento
            const processData = (workbook) => {
                let allItems = [];
                workbook.SheetNames.forEach(name => {
                    const ws = workbook.Sheets[name];
                    const json = XLSX.utils.sheet_to_json(ws);
                    allItems = [...allItems, ...json.map((row, idx) => ({
                        id: `item-${idx}-${Date.now()}`,
                        title: row.Title || row.Demanda || row.Nome || 'Sem Título',
                        status: row.Status || 'Backlog',
                        assignee: row.Assignees || row.Responsável || 'Indefinido',
                        product: row.Produto || row.Product || name,
                        type: row['Tipo de Er'] || row['Tipo de Entrega'] || row.Tipo || 'Feature',
                        sprint: String(row['Sprint Rel'] || row.Sprint || 'Roadmap'),
                        endDate: row['Data Fim'] || row.EndDate || null
                    }))];
                });
                setData(allItems);
            };

            const syncFromGoogle = async () => {
                if (!sheetUrl) return;
                setSyncStatus({ state: 'loading', msg: 'Sincronizando com a Cloud...' });
                
                try {
                    let fetchUrl = sheetUrl;
                    if (sheetUrl.includes('/edit')) {
                        const idMatch = sheetUrl.match(/\/d\/(.+?)\//);
                        if (idMatch) fetchUrl = `https://docs.google.com/spreadsheets/d/${idMatch[1]}/export?format=csv`;
                    }

                    const response = await fetch(fetchUrl);
                    if (!response.ok) throw new Error('Acesso negado. A planilha deve estar pública.');
                    
                    const csvText = await response.text();
                    const workbook = XLSX.read(csvText, { type: 'string' });
                    processData(workbook);
                    
                    setSyncStatus({ state: 'success', msg: 'Dados sincronizados com sucesso!' });
                    setTimeout(() => setView('dashboard'), 1000);
                } catch (err) {
                    setSyncStatus({ state: 'error', msg: 'Erro: Verifique se a planilha está publicada como CSV.' });
                }
            };

            // Métricas
            const filtered = useMemo(() => data.filter(i => i.title.toLowerCase().includes(searchTerm.toLowerCase())), [data, searchTerm]);
            
            const sprintMetrics = useMemo(() => {
                const current = filtered.filter(i => i.sprint.includes('20/03'));
                const done = current.filter(i => i.status === 'Entregue').length;
                const total = current.length;
                return {
                    total,
                    done,
                    perc: total > 0 ? Math.round((done / total) * 100) : 0,
                    waiting: total - done
                };
            }, [filtered]);

            const typeDistribution = useMemo(() => {
                const map = {};
                filtered.forEach(i => map[i.type] = (map[i.type] || 0) + 1);
                return Object.entries(map).map(([name, value]) => ({ name, value }));
            }, [filtered]);

            const productTypeMatrix = useMemo(() => {
                const products = [...new Set(filtered.map(i => i.product))];
                const types = [...new Set(filtered.map(i => i.type))];
                return products.map(p => {
                    const obj = { product: p };
                    types.forEach(t => {
                        obj[t] = filtered.filter(i => i.product === p && i.type === t).length;
                    });
                    return obj;
                });
            }, [filtered]);

            const allocationData = useMemo(() => {
                const assignees = [...new Set(filtered.map(i => i.assignee))];
                return assignees.map(name => ({
                    name,
                    count: filtered.filter(i => i.assignee === name).length
                })).sort((a,b) => b.count - a.count);
            }, [filtered]);

            const CustomTooltip = ({ active, payload, label }) => {
                if (active && payload && payload.length) {
                    return (
                        <div className="bg-dark-950 p-4 border border-white/10 rounded-2xl shadow-2xl">
                            <p className="text-xs font-black uppercase mb-2 text-slate-400">{label}</p>
                            {payload.map((p, i) => (
                                <div key={i} className="flex items-center justify-between gap-4 py-1">
                                    <div className="flex items-center gap-2">
                                        <div className="w-2 h-2 rounded-full" style={{backgroundColor: p.color}}></div>
                                        <span className="text-[10px] font-bold text-white/70 uppercase">{p.name}</span>
                                    </div>
                                    <span className="text-xs font-black text-white">{p.value}</span>
                                </div>
                            ))}
                        </div>
                    );
                }
                return null;
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* TOP NAV */}
                    <header className="px-8 py-6 flex items-center justify-between border-b border-white/5 sticky top-0 bg-dark-950/80 backdrop-blur-md z-50">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 bg-brand-600 rounded-2xl flex items-center justify-center neon-glow">
                                <Icon name="Dashboard" className="text-white w-6 h-6" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-black italic tracking-tighter uppercase">ARGUS<span className="text-brand-500 not-italic">CORE</span></h1>
                                <div className="flex items-center gap-2">
                                    <div className="w-2 h-2 bg-brand-accent rounded-full animate-pulse"></div>
                                    <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Live Operations • v8.0</p>
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center gap-4 bg-dark-800 p-1.5 rounded-2xl border border-white/5">
                            <button onClick={() => setView('dashboard')} className={`px-6 py-2.5 rounded-xl text-xs font-black uppercase transition-all ${view === 'dashboard' ? 'tab-active' : 'text-slate-500 hover:text-white'}`}>Insights</button>
                            <button onClick={() => setView('drilldown')} className={`px-6 py-2.5 rounded-xl text-xs font-black uppercase transition-all ${view === 'drilldown' ? 'tab-active' : 'text-slate-500 hover:text-white'}`}>Drill-Down</button>
                            <button onClick={() => setView('config')} className={`px-6 py-2.5 rounded-xl text-xs font-black uppercase transition-all ${view === 'config' ? 'tab-active' : 'text-slate-500 hover:text-white'}`}>Config</button>
                        </div>
                    </header>

                    <main className="p-8 max-w-[1800px] mx-auto w-full flex-grow space-y-8 fade-in">
                        {view === 'dashboard' && (
                            <div className="space-y-8">
                                {/* METRIC CARDS */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="glass-card p-8 rounded-5xl relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 p-8 opacity-10"><Icon name="Sync" className="w-24 h-24" /></div>
                                        <p className="text-[10px] font-black text-brand-accent uppercase tracking-widest mb-2">Ciclo Atual</p>
                                        <h2 className="text-3xl font-black mb-6">Sprint 20/03 - 02/04</h2>
                                        <div className="flex items-end justify-between mb-4">
                                            <span className="text-6xl font-black text-brand-accent">{sprintMetrics.perc}%</span>
                                            <div className="text-right">
                                                <p className="text-[10px] font-bold text-slate-500 uppercase">Total Tarefas</p>
                                                <p className="text-xl font-black">{sprintMetrics.total}</p>
                                            </div>
                                        </div>
                                        <div className="w-full bg-white/5 h-3 rounded-full overflow-hidden mb-6">
                                            <div className="h-full bg-brand-accent transition-all duration-1000" style={{width: `${sprintMetrics.perc}%`}}></div>
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="flex-1 bg-brand-accent/10 border border-brand-accent/20 p-4 rounded-3xl text-center">
                                                <p className="text-[9px] font-black text-brand-accent uppercase">Concluídas</p>
                                                <p className="text-2xl font-black">{sprintMetrics.done}</p>
                                            </div>
                                            <div className="flex-1 bg-white/5 border border-white/5 p-4 rounded-3xl text-center">
                                                <p className="text-[9px] font-black text-slate-500 uppercase">Aguardando</p>
                                                <p className="text-2xl font-black">{sprintMetrics.waiting}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="glass-card p-8 rounded-5xl col-span-1">
                                        <div className="flex justify-between items-center mb-8">
                                            <h3 className="text-xs font-black uppercase tracking-widest text-slate-400 italic">Distribuição por Tipo</h3>
                                            <div className="w-8 h-8 rounded-full bg-brand-500/10 flex items-center justify-center"><Icon name="Grid" className="w-4 h-4 text-brand-500" /></div>
                                        </div>
                                        <div className="h-[250px] w-full">
                                            <ResponsiveContainer>
                                                <PieChart>
                                                    <Pie data={typeDistribution} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={10} dataKey="value">
                                                        {typeDistribution.map((entry, index) => <Cell key={index} fill={CHART_COLORS[index % CHART_COLORS.length]} stroke="none" />)}
                                                        <Label value={data.length} position="center" fill="white" style={{ fontSize: '24px', fontWeight: '900' }} />
                                                    </Pie>
                                                    <Tooltip content={<CustomTooltip />} />
                                                </PieChart>
                                            </ResponsiveContainer>
                                        </div>
                                        <div className="mt-4 flex flex-wrap gap-4 justify-center">
                                            {typeDistribution.map((t, i) => (
                                                <div key={i} className="flex items-center gap-2">
                                                    <div className="w-2 h-2 rounded-full" style={{backgroundColor: CHART_COLORS[i % CHART_COLORS.length]}}></div>
                                                    <span className="text-[9px] font-black uppercase text-slate-400">{t.name}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="glass-card p-8 rounded-5xl">
                                        <h3 className="text-xs font-black uppercase tracking-widest text-slate-400 mb-8 italic">Responsáveis (Alocação)</h3>
                                        <div className="h-[300px] w-full">
                                            <ResponsiveContainer>
                                                <BarChart data={allocationData} layout="vertical">
                                                    <XAxis type="number" hide />
                                                    <YAxis dataKey="name" type="category" axisLine={false} tickLine={false} tick={{fill: '#94A3B8', fontSize: 10, fontWeight: 700}} width={100} />
                                                    <Tooltip cursor={{fill: 'transparent'}} content={<CustomTooltip />} />
                                                    <Bar dataKey="count" fill="#6366F1" radius={[0, 8, 8, 0]} barSize={20} />
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                </div>

                                {/* LARGE CHART SECTION */}
                                <div className="glass-card p-10 rounded-5xl">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
                                        <div>
                                            <p className="text-[10px] font-black text-brand-500 uppercase tracking-widest mb-1">BI: Cross-Section Analysis</p>
                                            <h3 className="text-4xl font-black italic tracking-tighter">Produto x Tipo de Entrega</h3>
                                        </div>
                                        <div className="flex bg-dark-900 p-1.5 rounded-2xl border border-white/5">
                                            <button onClick={() => setBarType('stacked')} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${barType === 'stacked' ? 'bg-brand-600 text-white' : 'text-slate-500'}`}>Empilhado</button>
                                            <button onClick={() => setBarType('grouped')} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${barType === 'grouped' ? 'bg-brand-600 text-white' : 'text-slate-500'}`}>Lateral</button>
                                        </div>
                                    </div>
                                    <div className="h-[450px] w-full">
                                        <ResponsiveContainer>
                                            <BarChart data={productTypeMatrix} margin={{top: 20, right: 30, left: 20, bottom: 5}}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#ffffff08" />
                                                <XAxis dataKey="product" axisLine={false} tickLine={false} tick={{fill: '#94A3B8', fontSize: 11, fontWeight: 800}} dy={15} />
                                                <YAxis axisLine={false} tickLine={false} tick={{fill: '#475569', fontSize: 10}} />
                                                <Tooltip content={<CustomTooltip />} cursor={{fill: 'rgba(255,255,255,0.03)'}} />
                                                <Legend wrapperStyle={{paddingTop: '40px', fontSize: '10px', fontWeight: 900, textTransform: 'uppercase'}} />
                                                {Object.keys(productTypeMatrix[0] || {}).filter(k => k !== 'product').map((key, i) => (
                                                    <Bar key={key} dataKey={key} stackId={barType === 'stacked' ? "a" : undefined} fill={CHART_COLORS[i % CHART_COLORS.length]} radius={barType === 'stacked' ? [0,0,0,0] : [6,6,0,0]} barSize={barType === 'stacked' ? 40 : 15} />
                                                ))}
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'drilldown' && (
                            <div className="space-y-8">
                                <div className="flex justify-between items-center bg-dark-800 p-6 rounded-4xl border border-white/5">
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center text-white"><Icon name={mode === 'kanban' ? "Grid" : "List"} /></div>
                                        <div><h3 className="text-2xl font-black italic uppercase italic tracking-tighter">Drill-Down Analítico</h3><p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Controlo de Tarefas por Produto</p></div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="relative">
                                            <Icon name="Search" className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" />
                                            <input type="text" placeholder="Pesquisar demanda..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-dark-950 border border-white/10 rounded-2xl pl-12 pr-6 py-3 text-xs font-bold outline-none focus:ring-2 focus:ring-brand-500/30 w-64" />
                                        </div>
                                        <button onClick={() => setMode(mode === 'kanban' ? 'list' : 'kanban')} className="bg-brand-600 px-6 py-3 rounded-2xl text-[10px] font-black uppercase shadow-lg shadow-brand-600/20">{mode === 'kanban' ? 'Ver Lista' : 'Ver Kanban'}</button>
                                    </div>
                                </div>

                                {mode === 'kanban' ? (
                                    <div className="flex gap-6 overflow-x-auto pb-8 custom-scrollbar">
                                        {[...new Set(data.map(i => i.product))].map(prod => {
                                            const items = filtered.filter(i => i.product === prod);
                                            return (
                                                <div key={prod} className="flex flex-col gap-4 min-w-[350px]">
                                                    <div className="flex items-center justify-between p-5 bg-dark-800 rounded-3xl border border-white/5">
                                                        <h4 className="text-xs font-black uppercase text-white truncate max-w-[200px]">{prod}</h4>
                                                        <span className="text-[10px] font-black bg-brand-500/10 text-brand-500 px-3 py-1 rounded-lg border border-brand-500/20">{items.length}</span>
                                                    </div>
                                                    <div className="space-y-4">
                                                        {items.map(item => (
                                                            <div key={item.id} className="glass-card p-6 rounded-[2rem] hover:scale-[1.02] transition-all cursor-pointer group">
                                                                <div className="flex justify-between items-start mb-4">
                                                                    <span className={`status-badge ${item.status === 'Entregue' ? 'bg-brand-accent/10 text-brand-accent border border-brand-accent/20' : 'bg-brand-500/10 text-brand-500 border border-brand-500/20'}`}>{item.status}</span>
                                                                    <span className="text-[9px] font-bold text-slate-500 uppercase tracking-tighter">Sprint {item.sprint}</span>
                                                                </div>
                                                                <h5 className="text-sm font-extrabold text-white mb-6 leading-tight group-hover:text-brand-500 transition-colors">{item.title}</h5>
                                                                <div className="pt-4 border-t border-white/5 flex justify-between items-center">
                                                                    <div className="flex items-center gap-2"><div className="w-6 h-6 rounded-full bg-dark-950 flex items-center justify-center text-[10px] font-black text-slate-400">?</div><span className="text-[10px] font-black text-slate-400 uppercase">{item.assignee}</span></div>
                                                                    <span className="text-[9px] font-black italic text-brand-500 uppercase tracking-widest">{item.type}</span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                        {items.length === 0 && <div className="text-center py-20 border-2 border-dashed border-white/5 rounded-4xl text-slate-600 font-bold uppercase text-[10px] tracking-widest italic">Vazio</div>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ) : (
                                    <div className="glass-card rounded-4xl overflow-hidden border border-white/5 shadow-2xl">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left">
                                                <thead className="bg-dark-800/50 text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] italic border-b border-white/5">
                                                    <tr><th className="px-8 py-6">Título da Demanda</th><th className="px-8 py-6">Status</th><th className="px-8 py-6">Responsável</th><th className="px-8 py-6">Tipo</th><th className="px-8 py-6">Produto</th><th className="px-8 py-6 text-right">Sprint</th></tr>
                                                </thead>
                                                <tbody className="divide-y divide-white/5">
                                                    {filtered.map(item => (
                                                        <tr key={item.id} className="hover:bg-white/[0.02] transition-colors group">
                                                            <td className="px-8 py-6"><p className="text-xs font-bold text-white group-hover:text-brand-500 transition-colors">{item.title}</p></td>
                                                            <td className="px-8 py-6"><span className="status-badge border border-white/10 bg-dark-800 text-slate-400">{item.status}</span></td>
                                                            <td className="px-8 py-6 font-black uppercase text-[10px] text-slate-400">{item.assignee}</td>
                                                            <td className="px-8 py-6 font-black italic text-brand-500 uppercase text-[9px] tracking-widest">{item.type}</td>
                                                            <td className="px-8 py-6 font-black uppercase text-[10px] text-white/70">{item.product}</td>
                                                            <td className="px-8 py-6 text-right font-mono text-xs text-slate-500">{item.sprint}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'config' && (
                            <div className="max-w-4xl mx-auto py-20 space-y-12">
                                <div className="glass-card rounded-5xl overflow-hidden shadow-[0_0_100px_rgba(99,102,241,0.1)]">
                                    <div className="p-12 bg-brand-600 text-white flex justify-between items-center">
                                        <div>
                                            <h2 className="text-5xl font-black italic uppercase tracking-tighter">Cloud Engine</h2>
                                            <p className="text-brand-100 text-[10px] font-black tracking-[0.5em] uppercase opacity-70 mt-2">Sincronização Ativa v8.0</p>
                                        </div>
                                        <Icon name="Link" className="w-20 h-20 opacity-20" />
                                    </div>
                                    <div className="p-12 space-y-10">
                                        <div className="space-y-6">
                                            <div className="flex items-center gap-3">
                                                <div className="w-2 h-8 bg-brand-500 rounded-full"></div>
                                                <h3 className="text-xl font-black italic uppercase tracking-tighter">Conectar Google Sheets</h3>
                                            </div>
                                            <div className="bg-white/[0.03] border border-white/5 p-8 rounded-4xl">
                                                <p className="text-xs text-slate-400 mb-6 leading-relaxed font-bold">
                                                    Para importar dados reais, cole o link da planilha. Certifique-se de que a planilha está <span className="text-brand-500 underline underline-offset-4 font-black">"Publicada na Web"</span> como <span className="text-brand-accent">CSV</span>.
                                                </p>
                                                <div className="flex flex-col gap-4">
                                                    <div className="relative">
                                                        <Icon name="Link" className="absolute left-6 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" />
                                                        <input type="text" placeholder="Cole o link do Google Sheets (CSV) aqui..." value={sheetUrl} onChange={e => setSheetUrl(e.target.value)} className="w-full pl-14 pr-6 py-5 bg-dark-950 border border-white/10 rounded-3xl text-xs font-bold outline-none focus:ring-4 focus:ring-brand-500/20 shadow-inner" />
                                                    </div>
                                                    <button onClick={syncFromGoogle} disabled={syncStatus.state === 'loading'} className="w-full bg-brand-600 py-5 rounded-3xl text-sm font-black uppercase shadow-2xl shadow-brand-600/30 hover:bg-brand-500 transition-all flex items-center justify-center gap-3 active:scale-[0.98]">
                                                        {syncStatus.state === 'loading' ? <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> : <Icon name="Sync" className="w-5 h-5" />}
                                                        Sincronizar Agora
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        {syncStatus.msg && (
                                            <div className={`p-6 rounded-3xl text-[10px] font-black uppercase text-center border-2 ${syncStatus.state === 'error' ? 'bg-red-500/5 border-red-500/20 text-red-500' : 'bg-brand-accent/5 border-brand-accent/20 text-brand-accent'}`}>
                                                {syncStatus.msg}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="text-center">
                                    <p className="text-[9px] font-black uppercase tracking-[0.8em] text-slate-700">Mapeamento: Title • Tipo de Er • Status • Assignees • Produto • Sprint Rel</p>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="p-8 border-t border-white/5 text-center">
                        <p className="text-[9px] font-black uppercase tracking-[0.6em] text-slate-700">Argus BI System • Infrastructure Intelligence • v8.0.1 Stable</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
