<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executivo Argus - Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM (Versão Estável 18.2.0) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- PropTypes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <!-- Recharts (Versão Estável 2.10.3) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS (XLSX) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 20px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, 
            PieChart, Pie, Cell 
        } = window.Recharts;

        // Ícones SVG para performance e zero dependências externas
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                LayoutDashboard: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
                Settings: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
                Search: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
                Filter: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>,
                Database: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>,
                Upload: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
                CalendarDays: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>,
                ArrowRight: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>,
                Package: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
                Check: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            };
            return icons[name] || <div className={className}>?</div>;
        };

        const initialData = [
            { id: 'v1', product: 'Argus Vision', title: 'Filtro de Convénio (Ajustes)', status: 'Backlog Produto', type: 'Correção', assignee: 'Nicollas-Lanzone', sprint: 'Roadmap' },
            { id: 'v2', product: 'Argus Vision', title: 'Restringir Filtros Base Válida', status: 'Backlog Produto', type: 'Melhoria', assignee: 'Nicollas-Lanzone', sprint: 'Roadmap' },
            { id: 'w1', product: 'Argus Watch', title: 'Dashboard Investigador (Correção)', status: 'Planejado', type: 'Correção', assignee: 'Markinjr92', sprint: '20/03 - 02/04' },
            { id: 'c1', product: 'Argus Clinical', title: 'Assinatura Eletrónica', status: 'Backlog Produto', type: 'Feature', assignee: 'cttgabriel', sprint: 'Roadmap' }
        ];

        const STATUS_COLORS = { 'Entregue': '#10b981', 'Planejado': '#3b82f6', 'Backlog Produto': '#64748b', 'Backlog': '#64748b' };
        const CHART_COLORS = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];

        function App() {
            const [currentView, setCurrentView] = useState('dashboard');
            const [rawData, setRawData] = useState(initialData);
            const [selectedProduct, setSelectedProduct] = useState('Todos');
            const [searchTerm, setSearchTerm] = useState('');
            const [chartFilters, setChartFilters] = useState({ status: null, assignee: null });
            const [importMessage, setImportMessage] = useState({ type: '', text: '' });

            const products = useMemo(() => ['Todos', ...new Set(rawData.map(item => item.product))], [rawData]);

            const filteredData = useMemo(() => {
                return rawData.filter(item => {
                    const matchProd = selectedProduct === 'Todos' || item.product === selectedProduct;
                    const matchSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchStatus = !chartFilters.status || item.status === chartFilters.status;
                    const matchAssignee = !chartFilters.assignee || item.assignee === chartFilters.assignee;
                    return matchProd && matchSearch && matchStatus && matchAssignee;
                });
            }, [selectedProduct, searchTerm, chartFilters, rawData]);

            const stats = useMemo(() => {
                const current = rawData.filter(i => (selectedProduct === 'Todos' || i.product === selectedProduct) && (i.sprint.includes('20/03') || i.status === 'Entregue'));
                const total = current.length;
                const delivered = current.filter(i => i.status === 'Entregue').length;
                return { total, delivered, progress: total > 0 ? (delivered / total) * 100 : 0 };
            }, [rawData, selectedProduct]);

            const backlogCount = useMemo(() => {
                return rawData.filter(i => (selectedProduct === 'Todos' || i.product === selectedProduct) && i.status.toLowerCase().includes('backlog')).length;
            }, [rawData, selectedProduct]);

            const statusData = useMemo(() => {
                const counts = filteredData.reduce((acc, item) => { acc[item.status] = (acc[item.status] || 0) + 1; return acc; }, {});
                return Object.entries(counts).map(([name, value]) => ({ name, value }));
            }, [filteredData]);

            const assigneeData = useMemo(() => {
                const counts = filteredData.reduce((acc, item) => { acc[item.assignee] = (acc[item.assignee] || 0) + 1; return acc; }, {});
                return Object.entries(counts).map(([name, value]) => ({ name, value })).sort((a,b) => b.value - a.value).slice(0, 5);
            }, [filteredData]);

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file || !window.XLSX) return;
                setImportMessage({ type: 'info', text: 'Processando...' });
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        let allData = [];
                        workbook.SheetNames.forEach(name => {
                            const ws = workbook.Sheets[name];
                            const json = XLSX.utils.sheet_to_json(ws);
                            const processed = json.map((row, idx) => {
                                const getVal = (names) => {
                                    const key = Object.keys(row).find(k => names.some(n => k.toLowerCase().replace(/\s/g, '').includes(n.toLowerCase().replace(/\s/g, ''))));
                                    return key ? String(row[key]).trim() : '';
                                };
                                return {
                                    id: `${name}-${idx}-${Date.now()}`,
                                    title: getVal(['Title', 'Demanda', 'Nome']),
                                    status: getVal(['Status']) || 'Backlog',
                                    assignee: getVal(['Assignee', 'Responsável', 'Dono']) || 'Sem Responsável',
                                    product: getVal(['Produto', 'Product']) || name,
                                    sprint: getVal(['Sprint', 'Release']) || 'Roadmap'
                                };
                            }).filter(i => i.title);
                            allData = [...allData, ...processed];
                        });
                        if (allData.length > 0) {
                            setRawData(allData);
                            setImportMessage({ type: 'success', text: 'Importado!' });
                            setTimeout(() => setCurrentView('dashboard'), 800);
                        }
                    } catch (err) { setImportMessage({ type: 'error', text: 'Erro ao ler Excel.' }); }
                };
                reader.readAsArrayBuffer(file);
            };

            const handleChartClick = (type, value) => setChartFilters(prev => ({ ...prev, [type]: prev[type] === value ? null : value }));

            return (
                <div className="max-w-[1400px] mx-auto min-h-screen px-4 py-6 md:px-8">
                    {/* Header Otimizado */}
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <div className="flex items-center gap-5">
                            <div className="flex gap-1.5 p-1.5 bg-slate-50 rounded-xl border border-slate-200">
                                <button onClick={() => setCurrentView('dashboard')} className={`p-2.5 rounded-lg transition-all ${currentView === 'dashboard' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'text-slate-400 hover:text-slate-600'}`}><Icon name="LayoutDashboard"/></button>
                                <button onClick={() => setCurrentView('settings')} className={`p-2.5 rounded-lg transition-all ${currentView === 'settings' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'text-slate-400 hover:text-slate-600'}`}><Icon name="Settings"/></button>
                            </div>
                            <div className="h-8 w-px bg-slate-200 mx-1 hidden md:block"></div>
                            <div>
                                <h1 className="text-xl font-black tracking-tight uppercase flex items-center gap-2">
                                    ARGUS <span className="text-indigo-600 italic">CORE</span>
                                    <span className="text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-500 font-bold border border-slate-200 uppercase tracking-tighter ml-1">v5.5</span>
                                </h1>
                            </div>
                        </div>

                        {currentView === 'dashboard' && (
                            <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                                <div className="relative flex-grow md:flex-grow-0">
                                    <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="Search" className="w-4 h-4"/></span>
                                    <input type="text" placeholder="Filtrar demanda..." className="pl-10 pr-4 py-2.5 bg-slate-50 border-none rounded-xl text-xs font-semibold w-full md:w-56 focus:ring-2 focus:ring-indigo-500 outline-none transition-all" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                                </div>
                                <select className="bg-slate-50 border-none rounded-xl text-xs font-bold px-4 py-2.5 outline-none cursor-pointer focus:ring-2 focus:ring-indigo-500 transition-all" value={selectedProduct} onChange={e => setSelectedProduct(e.target.value)}>
                                    {products.map(p => <option key={p} value={p}>{p}</option>)}
                                </select>
                                {(searchTerm || chartFilters.status || chartFilters.assignee) && (
                                    <button onClick={() => {setSearchTerm(''); setChartFilters({status:null, assignee:null})}} className="p-2.5 bg-red-50 text-red-500 rounded-xl hover:bg-red-100 transition-colors"><Icon name="RefreshCw" className="w-4 h-4"/></button>
                                )}
                            </div>
                        )}
                    </header>

                    <main>
                        {currentView === 'dashboard' ? (
                            <div className="grid grid-cols-12 gap-6">
                                {/* Cards Superiores */}
                                <div className="col-span-12 md:col-span-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100 group transition-all hover:shadow-md">
                                    <div className="flex justify-between items-start mb-6">
                                        <div className="p-3 bg-indigo-50 text-indigo-600 rounded-2xl"><Icon name="CalendarDays"/></div>
                                        <span className="text-[10px] font-black uppercase text-slate-400 tracking-widest border border-slate-100 px-2.5 py-1 rounded-lg">Ciclo Atual</span>
                                    </div>
                                    <div className="space-y-4">
                                        <div className="flex justify-between items-end">
                                            <h3 className="text-3xl font-black tracking-tighter">{stats.delivered}<span className="text-slate-300 mx-1">/</span><span className="text-slate-400">{stats.total}</span></h3>
                                            <span className="text-xs font-black text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md">{Math.round(stats.progress)}%</span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                            <div className="h-full bg-indigo-500 rounded-full transition-all duration-1000" style={{ width: `${stats.progress}%` }}></div>
                                        </div>
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-tight">Demandas concluídas no período</p>
                                    </div>
                                </div>

                                <div className="col-span-12 md:col-span-4 bg-indigo-600 p-6 rounded-3xl shadow-xl shadow-indigo-100 text-white relative overflow-hidden group hover:-translate-y-1 transition-all">
                                    <div className="absolute right-[-10px] top-[-10px] opacity-10 group-hover:scale-125 transition-transform"><Icon name="ArrowRight" className="w-32 h-32"/></div>
                                    <div className="relative z-10 flex flex-col h-full justify-between">
                                        <div className="flex justify-between items-center mb-6">
                                            <div className="p-3 bg-white/20 rounded-2xl"><Icon name="Database"/></div>
                                            <span className="text-[10px] font-black uppercase tracking-widest bg-white/10 px-2.5 py-1 rounded-lg border border-white/20">Roadmap</span>
                                        </div>
                                        <div>
                                            <h3 className="text-3xl font-black tracking-tighter mb-1">V.Next</h3>
                                            <p className="text-[10px] font-bold text-white/70 uppercase tracking-widest">Aguardando Refinamento</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="col-span-12 md:col-span-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100 group transition-all hover:shadow-md">
                                    <div className="flex justify-between items-start mb-6">
                                        <div className="p-3 bg-amber-50 text-amber-600 rounded-2xl"><Icon name="Package"/></div>
                                        <span className="text-[10px] font-black uppercase text-slate-400 tracking-widest border border-slate-100 px-2.5 py-1 rounded-lg">Repositório</span>
                                    </div>
                                    <div className="space-y-4">
                                        <h3 className="text-3xl font-black tracking-tighter">{backlogCount} <span className="text-xs text-slate-300 uppercase font-black ml-1">Itens em Backlog</span></h3>
                                        <div className="flex gap-1.5 flex-wrap">
                                            {rawData.filter(i => i.status.includes('Backlog')).slice(0, 3).map((b, idx) => (
                                                <span key={idx} className="text-[9px] font-bold bg-slate-50 text-slate-500 px-2 py-1 rounded border border-slate-100 uppercase truncate max-w-[100px]">{b.product}</span>
                                            ))}
                                            {backlogCount > 3 && <span className="text-[9px] font-bold text-slate-300">+{backlogCount - 3}</span>}
                                        </div>
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-tight">Carga de trabalho acumulada</p>
                                    </div>
                                </div>

                                {/* Gráficos - Layout Otimizado */}
                                <div className="col-span-12 lg:col-span-7 bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
                                    <h4 className="text-[10px] font-black uppercase text-slate-400 mb-8 tracking-widest flex items-center gap-2">
                                        <div className="w-1.5 h-1.5 rounded-full bg-indigo-500"></div> Estado das Entregas
                                    </h4>
                                    <div className="h-72">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={statusData} cx="50%" cy="50%" innerRadius={65} outerRadius={90} paddingAngle={8} dataKey="value" onClick={d => d && handleChartClick('status', d.name)} className="cursor-pointer outline-none">
                                                    {statusData.map((e,i) => <Cell key={i} fill={STATUS_COLORS[e.name] || CHART_COLORS[i % CHART_COLORS.length]} fillOpacity={!chartFilters.status || chartFilters.status === e.name ? 1 : 0.25} stroke="none" />)}
                                                </Pie>
                                                <Tooltip contentStyle={{borderRadius:'16px', border:'none', boxShadow:'0 10px 15px -3px rgb(0 0 0 / 0.1)'}} />
                                                <Legend verticalAlign="middle" align="right" layout="vertical" iconType="circle" wrapperStyle={{fontSize: '10px', fontWeight: 'bold', textTransform: 'uppercase', paddingLeft: '20px'}} />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div className="col-span-12 lg:col-span-5 bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
                                    <h4 className="text-[10px] font-black uppercase text-slate-400 mb-8 tracking-widest flex items-center gap-2">
                                        <div className="w-1.5 h-1.5 rounded-full bg-emerald-500"></div> Top 5 Alocações
                                    </h4>
                                    <div className="h-72">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={assigneeData} margin={{top:0, right:10, left:0, bottom:0}} onClick={s => s && s.activeLabel && handleChartClick('assignee', s.activeLabel)}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                <XAxis dataKey="name" fontSize={9} fontWeight="900" axisLine={false} tickLine={false} tick={{fill: '#94a3b8'}} />
                                                <YAxis hide />
                                                <Tooltip cursor={{fill: '#f8fafc'}} contentStyle={{borderRadius:'16px', border:'none'}} />
                                                <Bar dataKey="value" radius={[6,6,0,0]} barSize={25}>
                                                    {assigneeData.map((e,i) => <Cell key={i} fill="#6366f1" fillOpacity={!chartFilters.assignee || chartFilters.assignee === e.name ? 1 : 0.25} />)}
                                                </Bar>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                {/* Tabela Analítica - Maximizando uso de espaço */}
                                <div className="col-span-12 bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-6 border-b border-slate-50 flex justify-between items-center bg-slate-50/30">
                                        <h3 className="text-sm font-black text-slate-800 uppercase tracking-tighter flex items-center gap-3 italic">
                                            <Icon name="Layers" className="text-indigo-600 not-italic w-6 h-6"/> LISTAGEM <span className="text-slate-400 not-italic">ANALÍTICA</span>
                                        </h3>
                                        <div className="flex items-center gap-2">
                                            <span className="text-[9px] font-black bg-indigo-600 text-white px-3 py-1.5 rounded-xl shadow-sm">{filteredData.length} ITENS</span>
                                        </div>
                                    </div>
                                    <div className="overflow-x-auto max-h-[500px] custom-scrollbar">
                                        <table className="w-full text-left text-[11px] border-collapse">
                                            <thead className="bg-white text-slate-400 font-black uppercase tracking-widest sticky top-0 z-10 border-b border-slate-100">
                                                <tr>
                                                    <th className="px-8 py-5">Produto</th>
                                                    <th className="px-8 py-5">Demanda</th>
                                                    <th className="px-8 py-5">Responsável</th>
                                                    <th className="px-8 py-5 text-center">Status</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {filteredData.length > 0 ? filteredData.map((item, i) => (
                                                    <tr key={i} className="hover:bg-slate-50/80 transition-colors group">
                                                        <td className="px-8 py-5 font-black uppercase tracking-tighter text-slate-800">{item.product}</td>
                                                        <td className="px-8 py-5 font-bold text-slate-700 max-w-md truncate group-hover:text-indigo-600 transition-colors">{item.title}</td>
                                                        <td className="px-8 py-5 font-black uppercase text-slate-400">{item.assignee}</td>
                                                        <td className="px-8 py-5 text-center">
                                                            <span className={`px-3 py-1.5 rounded-lg text-[9px] font-black border uppercase shadow-sm inline-block min-w-[100px] ${item.status === 'Entregue' ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-slate-50 text-slate-500 border-slate-200'}`}>
                                                                {item.status}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                )) : (
                                                    <tr><td colSpan="4" className="p-20 text-center text-slate-300 font-black uppercase tracking-[0.3em]">Nenhum registro encontrado</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* Configurações - UI Centralizada */
                            <div className="max-w-xl mx-auto mt-10 bg-white rounded-[3rem] shadow-2xl border border-slate-100 overflow-hidden">
                                <div className="p-10 bg-slate-950 text-white text-center">
                                    <div className="bg-indigo-600 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-indigo-900/40"><Icon name="Database" className="w-10 h-10"/></div>
                                    <h2 className="text-3xl font-black uppercase tracking-tighter mb-2">DATA ENGINE</h2>
                                    <p className="text-slate-400 text-[10px] font-black uppercase tracking-[0.3em]">Sincronização de Backlogs</p>
                                </div>
                                <div className="p-12 space-y-8">
                                    <div className="bg-indigo-50/50 p-12 rounded-[2.5rem] border-2 border-dashed border-indigo-200 hover:border-indigo-500 relative flex flex-col items-center group cursor-pointer transition-all hover:bg-white hover:shadow-2xl hover:shadow-indigo-100">
                                        <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer z-20" />
                                        <div className="p-5 bg-indigo-600 text-white rounded-2xl mb-5 group-hover:scale-110 transition-transform shadow-lg"><Icon name="Upload" className="w-8 h-8"/></div>
                                        <p className="text-xl font-black text-slate-800 uppercase tracking-tighter">SUBIR EXCEL (.XLSX)</p>
                                        <p className="text-[10px] text-indigo-600 font-black uppercase tracking-widest mt-2">Clique para mapear sua máquina</p>
                                    </div>
                                    {importMessage.text && (
                                        <div className={`p-5 rounded-2xl text-[10px] font-black uppercase text-center border shadow-sm ${
                                            importMessage.type === 'error' ? 'bg-red-50 text-red-600 border-red-100' : 
                                            importMessage.type === 'success' ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-indigo-50 text-indigo-600 border-indigo-100'
                                        }`}>
                                            {importMessage.text}
                                        </div>
                                    )}
                                    <div className="grid grid-cols-2 gap-4 pt-6 border-t border-slate-100">
                                        <div className="bg-slate-50 p-4 rounded-2xl">
                                            <p className="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Última Sinc</p>
                                            <p className="text-xs font-bold text-slate-800 uppercase truncate">{lastSync}</p>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-2xl">
                                            <p className="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Lidos</p>
                                            <p className="text-xs font-bold text-slate-800 uppercase">{rawData.length} Itens</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="mt-16 text-center text-slate-300 text-[9px] font-black uppercase tracking-[0.5em] flex flex-col items-center gap-4">
                        <div className="flex items-center gap-3">
                            <div className="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)] animate-pulse"></div>
                            <span>ARGUS BI INFRASTRUCTURE • SECURE CONNECTION</span>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
