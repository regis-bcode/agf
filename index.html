<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executivo Argus - Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM (Versão Estável 18.2.0) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- PropTypes (Necessário para algumas builds UMD do Recharts) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <!-- Recharts (Versão Estável 2.10.3) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS (XLSX) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 20px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        // Acesso global seguro ao Recharts
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, 
            PieChart, Pie, Cell 
        } = window.Recharts;

        // Ícones via SVG manuais para total estabilidade no HTML standalone
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                LayoutDashboard: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
                Settings: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
                Search: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
                Filter: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>,
                Database: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>,
                Upload: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
                CalendarDays: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>,
                ArrowRightCircle: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="m12 16 4-4-4-4"/></svg>,
                Package: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
                Layers: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polygon points="2 17 12 22 22 17"/><polygon points="2 12 12 17 22 12"/></svg>,
                RefreshCw: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
            };
            return icons[name] || <div className={className}>?</div>;
        };

        const initialData = [
            { id: 'v1', product: 'Argus Vision', title: 'Corrigir filtro de convênio', status: 'Backlog Produto', type: 'Correção', activity: 'BackEnd', assignee: 'Nicollas-Lanzone', sprint: 'Roadmap' },
            { id: 'v2', product: 'Argus Vision', title: 'Restringir filtros base válida', status: 'Backlog Produto', type: 'Melhoria', activity: 'BackEnd', assignee: 'Nicollas-Lanzone', sprint: 'Roadmap' },
            { id: 'w1', product: 'Argus Watch', title: 'Dashboard sem filtros', status: 'Planejado', type: 'Correção', activity: 'BackEnd', assignee: 'Markinjr92', sprint: '20/03 - 02/04' },
            { id: 'c1', product: 'Argus Clinical', title: 'Ajuste Registro Atendimento', status: 'Backlog Produto', type: 'Correção', activity: 'BackEnd', assignee: 'cttgabriel', sprint: 'Roadmap' }
        ];

        const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
        const STATUS_COLORS = { 'Entregue': '#10b981', 'Planejado': '#3b82f6', 'Backlog Produto': '#64748b', 'Backlog': '#64748b' };

        const ProgressBar = ({ progress, label, variant = 'default' }) => (
            <div className="w-full">
                <div className="flex justify-between mb-1">
                    <span className={`text-[10px] font-black uppercase tracking-wider ${variant === 'dark' ? 'text-slate-400' : (variant === 'amber' ? 'text-amber-600' : 'text-slate-600')}`}>{label}</span>
                    <span className={`text-[10px] font-black ${variant === 'dark' ? 'text-blue-400' : 'text-slate-600'}`}>{Math.round(progress)}%</span>
                </div>
                <div className={`w-full rounded-full h-2 ${variant === 'dark' ? 'bg-slate-800' : 'bg-slate-100'}`}>
                    <div className={`h-2 rounded-full transition-all duration-700 ${variant === 'dark' ? 'bg-blue-500' : 'bg-emerald-500'}`} style={{ width: `${progress}%` }}></div>
                </div>
            </div>
        );

        function App() {
            const [currentView, setCurrentView] = useState('dashboard');
            const [rawData, setRawData] = useState(initialData);
            const [selectedProduct, setSelectedProduct] = useState('Todos');
            const [searchTerm, setSearchTerm] = useState('');
            const [chartFilters, setChartFilters] = useState({ status: null, type: null, assignee: null, activity: null });
            const [lastSync, setLastSync] = useState('Dados Iniciais');
            const [importedSheets, setImportedSheets] = useState([]);
            const [importMessage, setImportMessage] = useState({ type: '', text: '' });

            // Definindo a lista de produtos unicamente
            const products = useMemo(() => {
                const uniqueProducts = [...new Set(rawData.map(item => item.product))];
                return ['Todos', ...uniqueProducts];
            }, [rawData]);

            const activeFiltersCount = useMemo(() => {
                return Object.values(chartFilters).filter(v => v !== null).length;
            }, [chartFilters]);

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file || !window.XLSX) return;
                setImportMessage({ type: 'info', text: 'Lendo arquivo...' });
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        let allData = [];
                        let sheets = [];
                        workbook.SheetNames.forEach(name => {
                            const ws = workbook.Sheets[name];
                            const json = XLSX.utils.sheet_to_json(ws);
                            if (json.length > 0) {
                                const processed = json.map((row, idx) => {
                                    const getVal = (names) => {
                                        const key = Object.keys(row).find(k => names.some(n => k.toLowerCase().replace(/\s/g, '').includes(n.toLowerCase().replace(/\s/g, ''))));
                                        return key ? String(row[key]).trim() : '';
                                    };
                                    return {
                                        id: `${name}-${idx}-${Date.now()}`,
                                        title: getVal(['Title', 'Demanda', 'Nome']),
                                        status: getVal(['Status']) || 'Backlog',
                                        assignee: getVal(['Assignee', 'Responsável', 'Dono']) || 'Sem Responsável',
                                        product: getVal(['Produto', 'Product']) || name,
                                        type: getVal(['Tipo', 'Type']),
                                        activity: getVal(['Atividade', 'Activity']) || 'BackEnd',
                                        sprint: getVal(['Sprint', 'Release']) || 'Roadmap'
                                    };
                                }).filter(i => i.title);
                                allData = [...allData, ...processed];
                                sheets.push({ name, items: processed.length });
                            }
                        });
                        if (allData.length > 0) {
                            setRawData(allData);
                            setImportedSheets(sheets);
                            setLastSync(new Date().toLocaleTimeString());
                            setImportMessage({ type: 'success', text: 'Importado com sucesso!' });
                            setTimeout(() => setCurrentView('dashboard'), 1000);
                        }
                    } catch (err) { 
                        console.error(err);
                        setImportMessage({ type: 'error', text: 'Erro ao ler Excel.' }); 
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const filteredData = useMemo(() => {
                return rawData.filter(item => {
                    const matchProd = selectedProduct === 'Todos' || item.product === selectedProduct;
                    const matchSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchStatus = !chartFilters.status || item.status === chartFilters.status;
                    const matchAssignee = !chartFilters.assignee || item.assignee === chartFilters.assignee;
                    return matchProd && matchSearch && matchStatus && matchAssignee;
                });
            }, [selectedProduct, searchTerm, chartFilters, rawData]);

            const stats = useMemo(() => {
                const current = rawData.filter(i => (selectedProduct === 'Todos' || i.product === selectedProduct) && (i.sprint.includes('20/03') || i.status === 'Entregue'));
                const total = current.length;
                const delivered = current.filter(i => i.status === 'Entregue').length;
                return { total, delivered, progress: total > 0 ? (delivered / total) * 100 : 0 };
            }, [rawData, selectedProduct]);

            const backlogStats = useMemo(() => {
                const backlog = rawData.filter(i => (selectedProduct === 'Todos' || i.product === selectedProduct) && i.status.toLowerCase().includes('backlog'));
                const prodsList = [...new Set(rawData.map(item => item.product))];
                const breakdown = prodsList.map(p => ({
                    name: p,
                    count: rawData.filter(i => i.product === p && i.status.toLowerCase().includes('backlog')).length
                })).filter(p => p.count > 0).sort((a,b) => b.count - a.count);
                return { total: backlog.length, breakdown };
            }, [rawData, selectedProduct]);

            const statusData = useMemo(() => {
                const counts = filteredData.reduce((acc, item) => { acc[item.status] = (acc[item.status] || 0) + 1; return acc; }, {});
                return Object.entries(counts).map(([name, value]) => ({ name, value }));
            }, [filteredData]);

            const assigneeData = useMemo(() => {
                const counts = filteredData.reduce((acc, item) => { acc[item.assignee] = (acc[item.assignee] || 0) + 1; return acc; }, {});
                return Object.entries(counts).map(([name, value]) => ({ name, value })).sort((a,b) => b.value - a.value).slice(0, 5);
            }, [filteredData]);

            const handleChartClick = (type, value) => setChartFilters(prev => ({ ...prev, [type]: prev[type] === value ? null : value }));

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <header className="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-4">
                            <button onClick={() => setCurrentView('dashboard')} className={`p-2.5 rounded-xl transition-all ${currentView === 'dashboard' ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 border border-slate-200'}`}><Icon name="LayoutDashboard"/></button>
                            <button onClick={() => setCurrentView('settings')} className={`p-2.5 rounded-xl transition-all ${currentView === 'settings' ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 border border-slate-200'}`}><Icon name="Settings"/></button>
                            <div>
                                <h1 className="text-2xl font-black tracking-tighter uppercase italic leading-none">ARGUS ENGINE <span className="text-blue-500 not-italic">v5.3</span></h1>
                                <p className="text-[10px] text-slate-400 font-black uppercase tracking-widest mt-1">{currentView === 'dashboard' ? 'Analytics Visualizer' : 'Importador Excel'}</p>
                            </div>
                        </div>
                        {currentView === 'dashboard' && (
                            <div className="flex gap-3">
                                <div className="relative">
                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="Search" className="w-4 h-4"/></span>
                                    <input type="text" placeholder="Filtrar..." className="pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold w-48 focus:ring-2 focus:ring-blue-500 outline-none" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                                </div>
                                <select className="bg-white border border-slate-200 rounded-xl text-xs font-black px-4 py-2 outline-none cursor-pointer" value={selectedProduct} onChange={e => setSelectedProduct(e.target.value)}>
                                    <option value="Todos">Todos Produtos</option>
                                    {products.filter(p => p !== 'Todos').map(p => <option key={p} value={p}>{p}</option>)}
                                </select>
                            </div>
                        )}
                    </header>

                    <main className="max-w-7xl mx-auto">
                        {currentView === 'dashboard' ? (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                        <h2 className="text-[10px] font-black flex items-center gap-2 text-slate-400 uppercase tracking-widest mb-4"><Icon name="CalendarDays" className="w-4 h-4 text-emerald-500"/> Ciclo Atual</h2>
                                        <ProgressBar progress={stats.progress} label="Entregas" />
                                        <div className="mt-4 flex justify-between text-2xl font-black tracking-tighter">
                                            <span>{stats.total} <span className="text-xs text-slate-400 block uppercase">Escopo</span></span>
                                            <span className="text-emerald-600 text-right">{stats.delivered} <span className="text-xs text-slate-400 block uppercase">Prontos</span></span>
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 text-white p-6 rounded-3xl shadow-xl border border-slate-800">
                                        <h2 className="text-[10px] font-black flex items-center gap-2 text-slate-500 uppercase tracking-widest mb-4"><Icon name="ArrowRightCircle" className="w-4 h-4 text-blue-400"/> Próxima Sprint</h2>
                                        <ProgressBar progress={0} label="Refinamento" variant="dark" />
                                        <p className="mt-4 text-3xl font-black tracking-tighter">V.Next <span className="text-xs text-blue-400 uppercase font-black ml-2 tracking-widest">Aguardando</span></p>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                        <h2 className="text-[10px] font-black flex items-center gap-2 text-slate-400 uppercase tracking-widest mb-4"><Icon name="Package" className="w-4 h-4 text-amber-500"/> Backlog Produto</h2>
                                        <div className="space-y-2 max-h-[100px] overflow-y-auto custom-scrollbar">
                                            {backlogStats.breakdown.length > 0 ? backlogStats.breakdown.map((b,i) => (
                                                <div key={i} className="flex justify-between text-[10px] font-black text-slate-600 uppercase border-b border-slate-50 pb-1">
                                                    <span>{b.name}</span>
                                                    <span className="bg-slate-50 px-2 py-0.5 rounded">{b.count}</span>
                                                </div>
                                            )) : <p className="text-[10px] text-slate-400 italic">Sem itens.</p>}
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 h-80">
                                        <h3 className="text-[10px] font-black uppercase text-slate-400 mb-4 tracking-widest">Status & Categorias</h3>
                                        <ResponsiveContainer width="100%" height="90%">
                                            <PieChart>
                                                <Pie 
                                                    data={statusData} 
                                                    cx="50%" 
                                                    cy="50%" 
                                                    innerRadius={50} 
                                                    outerRadius={70} 
                                                    dataKey="value" 
                                                    onClick={d => d && handleChartClick('status', d.name)}
                                                    className="cursor-pointer outline-none"
                                                >
                                                    {statusData.map((e,i) => (
                                                        <Cell 
                                                            key={i} 
                                                            fill={STATUS_COLORS[e.name] || COLORS[i % COLORS.length]}
                                                            fillOpacity={!chartFilters.status || chartFilters.status === e.name ? 1 : 0.3}
                                                        />
                                                    ))}
                                                </Pie>
                                                <Tooltip />
                                                <Legend wrapperStyle={{fontSize: '9px', fontWeight: 'bold'}} />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    </div>
                                    <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 h-80">
                                        <h3 className="text-[10px] font-black uppercase text-slate-400 mb-4 tracking-widest">Top Alocações</h3>
                                        <ResponsiveContainer width="100%" height="90%">
                                            <BarChart data={assigneeData} onClick={s => s && s.activeLabel && handleChartClick('assignee', s.activeLabel)}>
                                                <XAxis dataKey="name" fontSize={9} fontWeight="bold" axisLine={false} tickLine={false} />
                                                <YAxis hide />
                                                <Tooltip cursor={{fill: 'transparent'}} />
                                                <Bar dataKey="value" radius={[4,4,0,0]} barSize={30} className="cursor-pointer">
                                                    {assigneeData.map((e,i) => (
                                                        <Cell 
                                                            key={i} 
                                                            fill="#10b981" 
                                                            fillOpacity={!chartFilters.assignee || chartFilters.assignee === e.name ? 1 : 0.3}
                                                        />
                                                    ))}
                                                </Bar>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <section className="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-6 border-b border-slate-100 flex justify-between bg-slate-50/20 items-center">
                                        <h3 className="text-sm font-black text-slate-800 uppercase tracking-tighter italic"><Icon name="Layers" className="inline w-5 h-5 mr-2 not-italic text-blue-600"/> Drill-Down Analítico</h3>
                                        <span className="text-[9px] font-black bg-blue-50 text-blue-600 px-3 py-1 rounded-xl shadow-sm">{filteredData.length} Itens Encontrados</span>
                                    </div>
                                    <div className="overflow-x-auto max-h-[400px] custom-scrollbar">
                                        <table className="w-full text-left text-[11px]">
                                            <thead className="bg-slate-50 text-slate-400 font-black uppercase tracking-widest sticky top-0 z-10">
                                                <tr><th className="px-6 py-4">Produto</th><th className="px-6 py-4">Demanda</th><th className="px-6 py-4">Dono</th><th className="px-6 py-4 text-center">Status</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {filteredData.length > 0 ? filteredData.map((item, i) => (
                                                    <tr key={i} className="hover:bg-blue-50/20 transition-colors">
                                                        <td className="px-6 py-4 font-black uppercase tracking-tighter text-slate-800">{item.product}</td>
                                                        <td className="px-6 py-4 font-bold text-slate-700">{item.title}</td>
                                                        <td className="px-6 py-4 font-black uppercase text-slate-400">{item.assignee}</td>
                                                        <td className="px-6 py-4 text-center">
                                                            <span className={`px-2.5 py-1 rounded-lg text-[9px] font-black border uppercase shadow-sm ${item.status === 'Entregue' ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-slate-50 text-slate-500 border-slate-200'}`}>{item.status}</span>
                                                        </td>
                                                    </tr>
                                                )) : (
                                                    <tr><td colSpan="4" className="p-10 text-center text-slate-400 font-bold uppercase tracking-widest">Nenhum dado encontrado</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </section>
                            </div>
                        ) : (
                            <div className="max-w-2xl mx-auto bg-white rounded-[2.5rem] shadow-2xl border border-slate-100 overflow-hidden">
                                <div className="p-10 bg-slate-950 text-white relative">
                                    <div className="absolute right-10 top-10 opacity-10"><Icon name="Database" className="w-24 h-24" /></div>
                                    <h2 className="text-3xl font-black uppercase tracking-tighter flex items-center gap-4"><Icon name="Database" className="w-10 h-10 text-blue-400"/> DATA SYNC ENGINE</h2>
                                    <p className="text-slate-400 text-xs font-bold uppercase tracking-widest mt-2">Versão XLSX / BI Connector</p>
                                </div>
                                <div className="p-10 space-y-8">
                                    <div className="bg-blue-50/50 p-10 rounded-[2rem] border-2 border-dashed border-blue-200 hover:border-blue-500 relative flex flex-col items-center group cursor-pointer transition-all">
                                        <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer z-20" title=" " />
                                        <div className="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform shadow-xl shadow-blue-200"><Icon name="Upload" className="w-8 h-8"/></div>
                                        <p className="text-xl font-black text-slate-800 uppercase tracking-tighter">APONTAR EXCEL (.XLSX)</p>
                                        <p className="text-[10px] text-blue-600 font-black uppercase tracking-widest mt-2">Selecione o arquivo da sua máquina</p>
                                    </div>
                                    {importMessage.text && (
                                        <div className={`p-4 rounded-xl text-xs font-bold uppercase text-center border animate-pulse ${
                                            importMessage.type === 'error' ? 'bg-red-50 text-red-600 border-red-100' : 
                                            importMessage.type === 'success' ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-blue-50 text-blue-600 border-blue-100'
                                        }`}>
                                            {importMessage.text}
                                        </div>
                                    )}
                                    <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest space-y-3 pt-4 border-t border-slate-100">
                                        <div className="flex justify-between"><span>Sincronização:</span> <span className="text-slate-900">{lastSync}</span></div>
                                        <div className="flex justify-between"><span>Abas Ativas:</span> <span className="text-slate-900">{importedSheets.length || (products.length - 1)} detectadas</span></div>
                                        <div className="flex justify-between"><span>Total Registros:</span> <span className="text-slate-900">{rawData.length} itens</span></div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="max-w-7xl mx-auto mt-12 text-center text-slate-300 text-[9px] font-black uppercase tracking-[0.4em] border-t border-slate-200 pt-8 flex flex-col md:flex-row justify-between gap-4">
                        <span>ARGUS CORE ENGINE • LIVE BI INTEGRATION</span>
                        <span className="text-slate-200">v5.3.5 STABLE RELEASE</span>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
