<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argus Core - Intelligence v8.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#03060B',
                            900: '#080C16',
                            800: '#111827',
                            700: '#1F2937'
                        },
                        brand: {
                            500: '#6366F1',
                            600: '#4F46E5',
                            accent: '#10B981',
                            warning: '#F59E0B',
                            danger: '#EF4444'
                        }
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '2.5rem'
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <!-- Dependencies must be in specific order for Recharts UMD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #03060B;
            color: #F8FAFC;
            overflow-x: hidden;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6366F144; border-radius: 20px; }

        .glass-card {
            background: linear-gradient(145deg, rgba(17, 24, 39, 0.8), rgba(8, 12, 22, 0.9));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
        }

        .status-badge {
            font-size: 9px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .neon-glow {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
        }
        
        .tab-active {
            background: #6366F1;
            color: white;
            box-shadow: 0 8px 16px -4px rgba(99, 102, 241, 0.4);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chart-container .recharts-cartesian-grid-horizontal line,
        .chart-container .recharts-cartesian-grid-vertical line {
            stroke: rgba(255, 255, 255, 0.03);
        }
    </style>
</head>
<body class="dark overflow-y-auto custom-scrollbar">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        // Recharts initialization guard
        const Recharts = window.Recharts;
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, 
            PieChart, Pie, Cell, Label, AreaChart, Area, ComposedChart, Line
        } = Recharts;

        const CHART_COLORS = ['#6366F1', '#10B981', '#F59E0B', '#F43F5E', '#8B5CF6', '#EC4899', '#0EA5E9', '#94A3B8'];

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Dashboard: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M4 5a1 1 0 011-1h4a1 1 0 011 1v5a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v2a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" /></svg>,
                Sync: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
                Grid: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
                List: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M4 6h16M4 12h16M4 18h16" /></svg>,
                Search: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
                Link: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.828a4 4 0 005.656 0l4-4a4 4 0 005.656 0l4-4a4 4 0 105.656 5.656l-1.1 1.1" /></svg>,
                Filter: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" /></svg>,
                Trending: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>
            };
            return icons[name] || <span>?</span>;
        };

        const initialMock = [
            { id: '1', title: 'Implementar Assinatura Eletrônica', product: 'Argus Clinical', status: 'Planejado', type: 'Feature', assignee: 'CTTGabriel', sprint: '20/03', priority: 'High' },
            { id: '2', title: 'Ajuste Cadastro de Paciente', product: 'Argus Clinical', status: 'Entregue', type: 'Correção', assignee: 'CTTGabriel', sprint: '20/03', priority: 'Medium' },
            { id: '3', title: 'IA com chat aberto', product: 'Argus Experience', status: 'Desenvolvimento', type: 'Feature', assignee: 'oliveirafacc', sprint: '20/03', priority: 'High' },
            { id: '4', title: 'Dashboard de Indicadores', product: 'Argus Watch', status: 'Planejado', type: 'Melhoria', assignee: 'Markinjr92', sprint: '20/03', priority: 'Medium' },
            { id: '5', title: 'Refatoração da API Core', product: 'Argus Clinical', status: 'Entregue', type: 'Melhoria', assignee: 'DevTeam', sprint: '20/03', priority: 'Critical' }
        ];

        function App() {
            const [view, setView] = useState('dashboard');
            const [mode, setMode] = useState('kanban');
            const [data, setData] = useState(initialMock);
            const [sheetUrl, setSheetUrl] = useState('');
            const [syncStatus, setSyncStatus] = useState({ state: 'idle', msg: '' });
            
            // Filters
            const [searchTerm, setSearchTerm] = useState('');
            const [productFilter, setProductFilter] = useState('All');
            const [typeFilter, setTypeFilter] = useState('All');
            
            const [barType, setBarType] = useState('stacked');

            // Unique Products and Types for filters
            const productsList = useMemo(() => ['All', ...new Set(data.map(i => i.product))], [data]);
            const typesList = useMemo(() => ['All', ...new Set(data.map(i => i.type))], [data]);

            // Filtered Data Logic
            const filtered = useMemo(() => {
                return data.filter(i => {
                    const matchSearch = i.title.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchProduct = productFilter === 'All' || i.product === productFilter;
                    const matchType = typeFilter === 'All' || i.type === typeFilter;
                    return matchSearch && matchProduct && matchType;
                });
            }, [data, searchTerm, productFilter, typeFilter]);

            // Data Processor
            const processData = (workbook) => {
                try {
                    let allItems = [];
                    workbook.SheetNames.forEach(name => {
                        const ws = workbook.Sheets[name];
                        const json = XLSX.utils.sheet_to_json(ws);
                        allItems = [...allItems, ...json.map((row, idx) => ({
                            id: `item-${idx}-${Date.now()}`,
                            title: row.Title || row.Demanda || row.Nome || row.Subject || 'Sem Título',
                            status: row.Status || row.State || 'Backlog',
                            assignee: row.Assignees || row.Responsável || row.Owner || 'Indefinido',
                            product: row.Produto || row.Product || row.Project || name,
                            type: row['Tipo de Er'] || row['Tipo de Entrega'] || row.Tipo || row.Category || 'Feature',
                            sprint: String(row['Sprint Rel'] || row.Sprint || row.Iteration || 'Roadmap'),
                            endDate: row['Data Fim'] || row.EndDate || row.ClosedDate || null,
                            priority: row.Priority || row.Prioridade || 'Normal'
                        }))];
                    });
                    setData(allItems);
                    setSyncStatus({ state: 'success', msg: `Sucesso: ${allItems.length} itens processados.` });
                    setTimeout(() => setView('dashboard'), 1500);
                } catch (e) {
                    setSyncStatus({ state: 'error', msg: 'Erro ao processar dados. Verifique o formato.' });
                }
            };

            const syncFromGoogle = async () => {
                if (!sheetUrl) return;
                setSyncStatus({ state: 'loading', msg: 'Acedendo aos servidores Cloud...' });
                
                try {
                    let fetchUrl = sheetUrl;
                    if (sheetUrl.includes('/edit')) {
                        const idMatch = sheetUrl.match(/\/d\/(.+?)\//);
                        if (idMatch) fetchUrl = `https://docs.google.com/spreadsheets/d/${idMatch[1]}/export?format=csv`;
                    }

                    const response = await fetch(fetchUrl);
                    if (!response.ok) throw new Error('Acesso negado.');
                    
                    const csvText = await response.text();
                    const workbook = XLSX.read(csvText, { type: 'string' });
                    processData(workbook);
                } catch (err) {
                    setSyncStatus({ state: 'error', msg: 'Planilha deve estar pública (CSV).' });
                }
            };

            // Metrics Computation
            const metrics = useMemo(() => {
                const total = filtered.length;
                const delivered = filtered.filter(i => ['Entregue', 'Concluído', 'Done', 'Closed'].includes(i.status)).length;
                const inProgress = filtered.filter(i => ['Em Desenvolvimento', 'Desenvolvimento', 'Progress', 'Doing'].includes(i.status)).length;
                const backlog = total - delivered - inProgress;
                
                return {
                    total,
                    delivered,
                    inProgress,
                    backlog,
                    perc: total > 0 ? Math.round((delivered / total) * 100) : 0
                };
            }, [filtered]);

            const typeDistribution = useMemo(() => {
                const map = {};
                filtered.forEach(i => map[i.type] = (map[i.type] || 0) + 1);
                return Object.entries(map).map(([name, value]) => ({ name, value }));
            }, [filtered]);

            const productTypeMatrix = useMemo(() => {
                const products = [...new Set(filtered.map(i => i.product))];
                const types = [...new Set(filtered.map(i => i.type))];
                return products.map(p => {
                    const obj = { product: p };
                    types.forEach(t => {
                        obj[t] = filtered.filter(i => i.product === p && i.type === t).length;
                    });
                    return obj;
                });
            }, [filtered]);

            const CustomTooltip = ({ active, payload, label }) => {
                if (active && payload && payload.length) {
                    return (
                        <div className="bg-dark-950 p-4 border border-white/10 rounded-2xl shadow-2xl backdrop-blur-xl">
                            <p className="text-[10px] font-black uppercase mb-3 text-slate-400 tracking-wider">{label}</p>
                            {payload.map((p, i) => (
                                <div key={i} className="flex items-center justify-between gap-6 py-1.5 border-t border-white/5 first:border-0">
                                    <div className="flex items-center gap-2">
                                        <div className="w-1.5 h-1.5 rounded-full" style={{backgroundColor: p.color}}></div>
                                        <span className="text-[10px] font-bold text-white/70 uppercase tracking-tight">{p.name}</span>
                                    </div>
                                    <span className="text-xs font-black text-white">{p.value}</span>
                                </div>
                            ))}
                        </div>
                    );
                }
                return null;
            };

            return (
                <div className="min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">
                    {/* NAV BAR */}
                    <header className="px-8 py-5 flex items-center justify-between border-b border-white/5 sticky top-0 bg-dark-950/80 backdrop-blur-xl z-[100]">
                        <div className="flex items-center gap-5">
                            <div className="w-12 h-12 bg-brand-600 rounded-2xl flex items-center justify-center neon-glow group cursor-pointer transition-transform active:scale-95">
                                <Icon name="Dashboard" className="text-white w-6 h-6 transition-transform group-hover:rotate-12" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-black italic tracking-tighter uppercase leading-none">ARGUS<span className="text-brand-500 not-italic">CORE</span></h1>
                                <div className="flex items-center gap-2 mt-1">
                                    <div className="w-1.5 h-1.5 bg-brand-accent rounded-full animate-pulse"></div>
                                    <p className="text-[9px] font-bold text-slate-500 uppercase tracking-[0.3em]">Operational Intel • v8.5.2</p>
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center gap-3 bg-dark-800 p-1 rounded-2xl border border-white/5 shadow-inner">
                            <button onClick={() => setView('dashboard')} className={`px-6 py-2.5 rounded-xl text-[11px] font-black uppercase transition-all duration-300 ${view === 'dashboard' ? 'tab-active' : 'text-slate-500 hover:text-white hover:bg-white/5'}`}>Dash</button>
                            <button onClick={() => setView('drilldown')} className={`px-6 py-2.5 rounded-xl text-[11px] font-black uppercase transition-all duration-300 ${view === 'drilldown' ? 'tab-active' : 'text-slate-500 hover:text-white hover:bg-white/5'}`}>Analytics</button>
                            <button onClick={() => setView('config')} className={`px-6 py-2.5 rounded-xl text-[11px] font-black uppercase transition-all duration-300 ${view === 'config' ? 'tab-active' : 'text-slate-500 hover:text-white hover:bg-white/5'}`}>Engine</button>
                        </div>
                    </header>

                    {/* GLOBAL FILTERS (Sticky below header) */}
                    <div className="px-8 py-4 bg-dark-900/50 border-b border-white/5 backdrop-blur-sm sticky top-[89px] z-[90] flex flex-wrap items-center gap-6">
                        <div className="flex items-center gap-3">
                            <Icon name="Filter" className="w-4 h-4 text-brand-500" />
                            <span className="text-[10px] font-black uppercase text-slate-500 tracking-widest">Filtros Ativos:</span>
                        </div>
                        
                        <select 
                            value={productFilter} 
                            onChange={e => setProductFilter(e.target.value)}
                            className="bg-dark-800 border border-white/10 rounded-xl px-4 py-2 text-[10px] font-bold outline-none text-slate-300 focus:border-brand-500"
                        >
                            {productsList.map(p => <option key={p} value={p}>{p === 'All' ? 'Todos os Produtos' : p}</option>)}
                        </select>

                        <select 
                            value={typeFilter} 
                            onChange={e => setTypeFilter(e.target.value)}
                            className="bg-dark-800 border border-white/10 rounded-xl px-4 py-2 text-[10px] font-bold outline-none text-slate-300 focus:border-brand-500"
                        >
                            {typesList.map(t => <option key={t} value={t}>{t === 'All' ? 'Todos os Tipos' : t}</option>)}
                        </select>

                        <div className="relative flex-grow max-w-sm ml-auto">
                            <Icon name="Search" className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" />
                            <input 
                                type="text" 
                                placeholder="Pesquisar em tudo..." 
                                value={searchTerm} 
                                onChange={e => setSearchTerm(e.target.value)} 
                                className="w-full bg-dark-800 border border-white/10 rounded-xl pl-12 pr-6 py-2.5 text-[11px] font-bold outline-none focus:ring-2 focus:ring-brand-500/20" 
                            />
                        </div>
                    </div>

                    <main className="p-8 max-w-[1920px] mx-auto w-full flex-grow space-y-10 fade-in">
                        {view === 'dashboard' && (
                            <div className="grid grid-cols-12 gap-8">
                                {/* STATS SUMMARY */}
                                <div className="col-span-12 grid grid-cols-1 md:grid-cols-4 gap-6">
                                    {[
                                        { label: 'Total Demanda', val: metrics.total, color: 'text-white', icon: 'Grid' },
                                        { label: 'Em Desenvolvimento', val: metrics.inProgress, color: 'text-brand-500', icon: 'Trending' },
                                        { label: 'Entregue / Concluído', val: metrics.delivered, color: 'text-brand-accent', icon: 'Sync' },
                                        { label: 'Taxa de Entrega', val: `${metrics.perc}%`, color: 'text-white', icon: 'Trending' }
                                    ].map((s, idx) => (
                                        <div key={idx} className="glass-card p-6 rounded-4xl flex items-center justify-between">
                                            <div>
                                                <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">{s.label}</p>
                                                <h4 className={`text-3xl font-black ${s.color}`}>{s.val}</h4>
                                            </div>
                                            <div className="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center opacity-40">
                                                <Icon name={s.icon} />
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* TYPE DIST (Donut) */}
                                <div className="col-span-12 lg:col-span-4 glass-card p-8 rounded-5xl">
                                    <h3 className="text-xs font-black uppercase tracking-[0.2em] text-slate-400 mb-8 flex items-center gap-2">
                                        <span className="w-2 h-2 bg-brand-500 rounded-full"></span> Distribuição Analítica
                                    </h3>
                                    <div className="h-[280px] w-full chart-container">
                                        <ResponsiveContainer>
                                            <PieChart>
                                                <Pie data={typeDistribution} cx="50%" cy="50%" innerRadius={70} outerRadius={90} paddingAngle={8} dataKey="value">
                                                    {typeDistribution.map((entry, index) => <Cell key={index} fill={CHART_COLORS[index % CHART_COLORS.length]} stroke="none" />)}
                                                    <Label value={metrics.total} position="center" fill="white" style={{ fontSize: '32px', fontWeight: '900' }} />
                                                </Pie>
                                                <Tooltip content={<CustomTooltip />} />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 mt-6">
                                        {typeDistribution.slice(0, 4).map((t, i) => (
                                            <div key={i} className="flex items-center gap-3 p-3 bg-white/5 rounded-2xl">
                                                <div className="w-2 h-2 rounded-full" style={{backgroundColor: CHART_COLORS[i % CHART_COLORS.length]}}></div>
                                                <div className="flex flex-col">
                                                    <span className="text-[10px] font-black text-white/90 truncate">{t.name}</span>
                                                    <span className="text-[9px] font-bold text-slate-500">{t.value} Itens</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* CROSS-SECTION BARS */}
                                <div className="col-span-12 lg:col-span-8 glass-card p-8 rounded-5xl">
                                    <div className="flex justify-between items-center mb-10">
                                        <div>
                                            <h3 className="text-xl font-black italic tracking-tighter uppercase">Produto vs Entrega</h3>
                                            <p className="text-[9px] font-black text-slate-500 tracking-[0.3em] uppercase mt-1">Visão Comparativa por Tipologia</p>
                                        </div>
                                        <div className="flex bg-dark-900 p-1 rounded-xl border border-white/5">
                                            <button onClick={() => setBarType('stacked')} className={`px-4 py-2 rounded-lg text-[9px] font-black uppercase transition-all ${barType === 'stacked' ? 'bg-brand-600' : 'text-slate-500'}`}>Empilhado</button>
                                            <button onClick={() => setBarType('grouped')} className={`px-4 py-2 rounded-lg text-[9px] font-black uppercase transition-all ${barType === 'grouped' ? 'bg-brand-600' : 'text-slate-500'}`}>Lateral</button>
                                        </div>
                                    </div>
                                    <div className="h-[380px] w-full chart-container">
                                        <ResponsiveContainer>
                                            <BarChart data={productTypeMatrix} margin={{top: 10, right: 10, left: 0, bottom: 20}}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                                <XAxis dataKey="product" axisLine={false} tickLine={false} tick={{fill: '#64748b', fontSize: 10, fontWeight: 800}} dy={15} />
                                                <YAxis axisLine={false} tickLine={false} tick={{fill: '#475569', fontSize: 10}} />
                                                <Tooltip content={<CustomTooltip />} cursor={{fill: 'rgba(255,255,255,0.03)'}} />
                                                <Legend iconType="circle" wrapperStyle={{paddingTop: '30px', fontSize: '9px', fontWeight: 900, textTransform: 'uppercase'}} />
                                                {Object.keys(productTypeMatrix[0] || {}).filter(k => k !== 'product').map((key, i) => (
                                                    <Bar key={key} dataKey={key} stackId={barType === 'stacked' ? "a" : undefined} fill={CHART_COLORS[i % CHART_COLORS.length]} radius={barType === 'stacked' ? [0,0,0,0] : [4,4,0,0]} barSize={barType === 'stacked' ? 45 : 12} />
                                                ))}
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'drilldown' && (
                            <div className="space-y-8">
                                <div className="flex justify-between items-center bg-dark-800/50 p-6 rounded-4xl border border-white/5">
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 bg-brand-600/20 text-brand-500 rounded-xl flex items-center justify-center"><Icon name={mode === 'kanban' ? "Grid" : "List"} /></div>
                                        <div>
                                            <h3 className="text-2xl font-black italic uppercase tracking-tighter italic leading-none">Intelligence Hub</h3>
                                            <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">Exploração de dados operacionais</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <button onClick={() => setMode(mode === 'kanban' ? 'list' : 'kanban')} className="bg-brand-600 px-6 py-3 rounded-2xl text-[10px] font-black uppercase shadow-lg shadow-brand-600/20 hover:bg-brand-500 transition-all flex items-center gap-2">
                                            <Icon name={mode === 'kanban' ? "List" : "Grid"} className="w-3.5 h-3.5" />
                                            {mode === 'kanban' ? 'Modo Lista' : 'Modo Kanban'}
                                        </button>
                                    </div>
                                </div>

                                {mode === 'kanban' ? (
                                    <div className="flex gap-8 overflow-x-auto pb-10 custom-scrollbar">
                                        {productsList.filter(p => p !== 'All' && (productFilter === 'All' || p === productFilter)).map(prod => {
                                            const items = filtered.filter(i => i.product === prod);
                                            return (
                                                <div key={prod} className="flex flex-col gap-5 min-w-[360px] max-w-[360px]">
                                                    <div className="flex items-center justify-between px-6 py-4 bg-dark-800 rounded-2xl border border-white/5 shadow-lg">
                                                        <h4 className="text-[11px] font-black uppercase text-slate-300 truncate tracking-wider">{prod}</h4>
                                                        <span className="text-[10px] font-black bg-brand-500/10 text-brand-500 px-3 py-1 rounded-lg border border-brand-500/20">{items.length}</span>
                                                    </div>
                                                    <div className="flex flex-col gap-4 overflow-y-auto max-h-[70vh] custom-scrollbar pr-2">
                                                        {items.map(item => (
                                                            <div key={item.id} className="glass-card p-6 rounded-3xl hover:-translate-y-1 group">
                                                                <div className="flex justify-between items-start mb-4">
                                                                    <span className={`status-badge ${['Entregue', 'Concluído'].includes(item.status) ? 'bg-brand-accent/10 text-brand-accent border border-brand-accent/20' : 'bg-brand-warning/10 text-brand-warning border border-brand-warning/20'}`}>
                                                                        {item.status}
                                                                    </span>
                                                                    <div className="flex gap-1">
                                                                        {item.priority === 'High' || item.priority === 'Critical' ? (
                                                                            <span className="w-1.5 h-1.5 rounded-full bg-brand-danger animate-pulse"></span>
                                                                        ) : null}
                                                                    </div>
                                                                </div>
                                                                <h5 className="text-sm font-extrabold text-white mb-6 leading-relaxed group-hover:text-brand-500 transition-colors line-clamp-2">{item.title}</h5>
                                                                <div className="pt-5 border-t border-white/5 flex justify-between items-center">
                                                                    <div className="flex items-center gap-2">
                                                                        <div className="w-7 h-7 rounded-full bg-dark-950 border border-white/10 flex items-center justify-center text-[10px] font-black text-slate-400">
                                                                            {item.assignee.substring(0, 2).toUpperCase()}
                                                                        </div>
                                                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-tight">{item.assignee}</span>
                                                                    </div>
                                                                    <span className="text-[9px] font-black italic text-brand-500 uppercase tracking-[0.2em]">{item.type}</span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                        {items.length === 0 && (
                                                            <div className="text-center py-20 border-2 border-dashed border-white/5 rounded-4xl text-slate-700 font-bold uppercase text-[9px] tracking-widest italic">
                                                                Nenhum item encontrado
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ) : (
                                    <div className="glass-card rounded-4xl overflow-hidden border border-white/5">
                                        <div className="overflow-x-auto custom-scrollbar">
                                            <table className="w-full text-left">
                                                <thead className="bg-dark-800/80 text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] border-b border-white/5">
                                                    <tr>
                                                        <th className="px-8 py-6">Título da Demanda</th>
                                                        <th className="px-8 py-6">Status</th>
                                                        <th className="px-8 py-6">Responsável</th>
                                                        <th className="px-8 py-6">Tipo</th>
                                                        <th className="px-8 py-6">Produto</th>
                                                        <th className="px-8 py-6 text-right">Sprint</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-white/5">
                                                    {filtered.map(item => (
                                                        <tr key={item.id} className="hover:bg-white/[0.02] transition-colors group">
                                                            <td className="px-8 py-6 max-w-md">
                                                                <p className="text-xs font-bold text-white group-hover:text-brand-500 transition-colors truncate">{item.title}</p>
                                                            </td>
                                                            <td className="px-8 py-6">
                                                                <span className="status-badge border border-white/5 bg-dark-800 text-slate-400">{item.status}</span>
                                                            </td>
                                                            <td className="px-8 py-6 font-black uppercase text-[10px] text-slate-400">{item.assignee}</td>
                                                            <td className="px-8 py-6 font-black italic text-brand-500 uppercase text-[9px] tracking-widest">{item.type}</td>
                                                            <td className="px-8 py-6 font-black uppercase text-[10px] text-white/50">{item.product}</td>
                                                            <td className="px-8 py-6 text-right font-mono text-[10px] text-slate-500">{item.sprint}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'config' && (
                            <div className="max-w-4xl mx-auto py-12 space-y-12">
                                <div className="glass-card rounded-5xl overflow-hidden shadow-[0_0_100px_rgba(99,102,241,0.1)]">
                                    <div className="p-16 bg-gradient-to-br from-brand-600 to-indigo-800 text-white flex justify-between items-center">
                                        <div>
                                            <h2 className="text-6xl font-black italic uppercase tracking-tighter">Sync Engine</h2>
                                            <p className="text-brand-100 text-[11px] font-black tracking-[0.5em] uppercase opacity-60 mt-4 flex items-center gap-3">
                                                <span className="w-3 h-3 bg-brand-accent rounded-full animate-pulse"></span>
                                                Status: Conexão Estável
                                            </p>
                                        </div>
                                        <Icon name="Sync" className="w-24 h-24 opacity-20 animate-spin-slow" style={{animationDuration: '10s'}} />
                                    </div>
                                    <div className="p-12 space-y-10">
                                        <div className="space-y-6">
                                            <div className="flex items-center gap-4">
                                                <div className="w-2 h-10 bg-brand-500 rounded-full"></div>
                                                <h3 className="text-2xl font-black italic uppercase tracking-tighter">Google Sheets Integration</h3>
                                            </div>
                                            <div className="bg-white/[0.03] border border-white/5 p-10 rounded-4xl">
                                                <p className="text-sm text-slate-400 mb-8 leading-relaxed font-medium">
                                                    Para alimentar o dashboard com dados reais, utilize a função <span className="text-white font-black">"Publicar na Web"</span> do Google Sheets. Escolha o formato <span className="text-brand-accent font-black">CSV</span> e cole o link abaixo.
                                                </p>
                                                <div className="flex flex-col gap-6">
                                                    <div className="relative group">
                                                        <Icon name="Link" className="absolute left-6 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500 transition-colors group-focus-within:text-brand-500" />
                                                        <input 
                                                            type="text" 
                                                            placeholder="https://docs.google.com/spreadsheets/d/.../export?format=csv" 
                                                            value={sheetUrl} 
                                                            onChange={e => setSheetUrl(e.target.value)} 
                                                            className="w-full pl-16 pr-6 py-6 bg-dark-950 border border-white/10 rounded-3xl text-xs font-bold outline-none focus:ring-4 focus:ring-brand-500/10 shadow-inner transition-all" 
                                                        />
                                                    </div>
                                                    <button 
                                                        onClick={syncFromGoogle} 
                                                        disabled={syncStatus.state === 'loading'} 
                                                        className="w-full bg-brand-600 py-6 rounded-3xl text-sm font-black uppercase shadow-2xl shadow-brand-600/30 hover:bg-brand-500 transition-all flex items-center justify-center gap-4 active:scale-[0.98] disabled:opacity-50"
                                                    >
                                                        {syncStatus.state === 'loading' ? <div className="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> : <Icon name="Sync" className="w-6 h-6" />}
                                                        Trigger Sync Cycle
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        {syncStatus.msg && (
                                            <div className={`p-8 rounded-4xl text-xs font-black uppercase text-center border-2 transition-all scale-100 animate-bounce-short ${syncStatus.state === 'error' ? 'bg-brand-danger/10 border-brand-danger/20 text-brand-danger' : 'bg-brand-accent/10 border-brand-accent/20 text-brand-accent'}`}>
                                                {syncStatus.msg}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-8">
                                    <div className="glass-card p-8 rounded-4xl border-l-4 border-brand-500">
                                        <h4 className="text-[10px] font-black uppercase text-slate-500 tracking-widest mb-4 italic">Mapeamento de Colunas (Obrigatório)</h4>
                                        <ul className="space-y-3">
                                            {['Title', 'Status', 'Assignees', 'Produto', 'Tipo de Er', 'Sprint Rel'].map(col => (
                                                <li key={col} className="flex items-center gap-3 text-[11px] font-black text-white/80">
                                                    <div className="w-1.5 h-1.5 bg-brand-500 rounded-full"></div> {col}
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                    <div className="glass-card p-8 rounded-4xl">
                                        <h4 className="text-[10px] font-black uppercase text-slate-500 tracking-widest mb-4 italic">Sobre o Sistema</h4>
                                        <p className="text-[10px] text-slate-400 font-bold leading-relaxed">
                                            O Argus Core v8.5 processa conjuntos de dados multi-sheet. Se o link fornecido exportar múltiplas páginas, o sistema consolidará automaticamente todas as tarefas em um único fluxo analítico.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="p-10 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-4 opacity-50 grayscale hover:grayscale-0 transition-all">
                        <div className="flex items-center gap-3">
                             <h1 className="text-xl font-black italic tracking-tighter uppercase leading-none">ARGUS<span className="text-brand-500 not-italic">BI</span></h1>
                        </div>
                        <p className="text-[9px] font-black uppercase tracking-[0.8em] text-slate-600">Infrastructure Intelligence Ecosystem • v8.5.2 Stable Build</p>
                        <div className="flex gap-4">
                            <span className="text-[9px] font-black text-slate-600 uppercase tracking-widest">© 2024 ARGUS SYSTEMS</span>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
