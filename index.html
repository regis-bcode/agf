<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executivo Argus - Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- PropTypes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <!-- Recharts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS (XLSX) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 20px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        .card-shadow { box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05), 0 1px 2px -1px rgb(0 0 0 / 0.05); }
    </style>
</head>
<body class="bg-[#F9FAFB] text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, 
            PieChart, Pie, Cell 
        } = window.Recharts;

        const Icon = ({ name, className = "w-4 h-4" }) => {
            const icons = {
                LayoutDashboard: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
                Settings: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
                Search: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
                Filter: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>,
                Database: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>,
                Upload: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
                Calendar: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
                Package: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
                Refresh: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
            };
            return icons[name] || <div className={className}>?</div>;
        };

        const initialData = [
            { id: 'v1', product: 'Argus Vision', title: 'Filtro de Convénio (Ajustes)', status: 'Backlog Produto', type: 'Correção', assignee: 'Nicollas-Lanzone', sprint: 'Roadmap' },
            { id: 'v2', product: 'Argus Vision', title: 'Restringir Filtros Base Válida', status: 'Backlog Produto', type: 'Melhoria', assignee: 'Nicollas-Lanzone', sprint: 'Roadmap' },
            { id: 'w1', product: 'Argus Watch', title: 'Dashboard Investigador (Correção)', status: 'Planejado', type: 'Correção', assignee: 'Markinjr92', sprint: '20/03 - 02/04' },
            { id: 'c1', product: 'Argus Clinical', title: 'Assinatura Eletrónica', status: 'Backlog Produto', type: 'Feature', assignee: 'cttgabriel', sprint: 'Roadmap' }
        ];

        const STATUS_COLORS = { 'Entregue': '#10b981', 'Planejado': '#3b82f6', 'Backlog Produto': '#64748b', 'Backlog': '#64748b' };
        const CHART_COLORS = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];

        function App() {
            const [currentView, setCurrentView] = useState('dashboard');
            const [rawData, setRawData] = useState(initialData);
            const [selectedProduct, setSelectedProduct] = useState('Todos');
            const [searchTerm, setSearchTerm] = useState('');
            const [chartFilters, setChartFilters] = useState({ status: null, assignee: null });
            const [importMessage, setImportMessage] = useState({ type: '', text: '' });

            const products = useMemo(() => ['Todos', ...new Set(rawData.map(item => item.product))], [rawData]);

            const filteredData = useMemo(() => {
                return rawData.filter(item => {
                    const matchProd = selectedProduct === 'Todos' || item.product === selectedProduct;
                    const matchSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchStatus = !chartFilters.status || item.status === chartFilters.status;
                    const matchAssignee = !chartFilters.assignee || item.assignee === chartFilters.assignee;
                    return matchProd && matchSearch && matchStatus && matchAssignee;
                });
            }, [selectedProduct, searchTerm, chartFilters, rawData]);

            const stats = useMemo(() => {
                const current = rawData.filter(i => (selectedProduct === 'Todos' || i.product === selectedProduct) && (i.sprint.includes('20/03') || i.status === 'Entregue'));
                const total = current.length;
                const delivered = current.filter(i => i.status === 'Entregue').length;
                return { total, delivered, progress: total > 0 ? (delivered / total) * 100 : 0 };
            }, [rawData, selectedProduct]);

            const backlogCount = useMemo(() => {
                return rawData.filter(i => (selectedProduct === 'Todos' || i.product === selectedProduct) && i.status.toLowerCase().includes('backlog')).length;
            }, [rawData, selectedProduct]);

            const statusData = useMemo(() => {
                const counts = filteredData.reduce((acc, item) => { acc[item.status] = (acc[item.status] || 0) + 1; return acc; }, {});
                return Object.entries(counts).map(([name, value]) => ({ name, value }));
            }, [filteredData]);

            const assigneeData = useMemo(() => {
                const counts = filteredData.reduce((acc, item) => { acc[item.assignee] = (acc[item.assignee] || 0) + 1; return acc; }, {});
                return Object.entries(counts).map(([name, value]) => ({ name, value })).sort((a,b) => b.value - a.value).slice(0, 5);
            }, [filteredData]);

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file || !window.XLSX) return;
                setImportMessage({ type: 'info', text: 'Importando...' });
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        let allData = [];
                        workbook.SheetNames.forEach(name => {
                            const ws = workbook.Sheets[name];
                            const json = XLSX.utils.sheet_to_json(ws);
                            const processed = json.map((row, idx) => {
                                const getVal = (names) => {
                                    const key = Object.keys(row).find(k => names.some(n => k.toLowerCase().replace(/\s/g, '').includes(n.toLowerCase().replace(/\s/g, ''))));
                                    return key ? String(row[key]).trim() : '';
                                };
                                return {
                                    id: `${name}-${idx}-${Date.now()}`,
                                    title: getVal(['Title', 'Demanda', 'Nome']),
                                    status: getVal(['Status']) || 'Backlog',
                                    assignee: getVal(['Assignee', 'Responsável', 'Dono', 'Assignees']) || 'Sem Responsável',
                                    product: getVal(['Produto', 'Product']) || name,
                                    sprint: getVal(['Sprint', 'Release', 'Sprint Release']) || 'Roadmap'
                                };
                            }).filter(i => i.title);
                            allData = [...allData, ...processed];
                        });
                        setRawData(allData);
                        setImportMessage({ type: 'success', text: 'Sucesso!' });
                        setTimeout(() => { setImportMessage({type:'', text:''}); setCurrentView('dashboard'); }, 800);
                    } catch (err) { setImportMessage({ type: 'error', text: 'Falha no XLSX' }); }
                };
                reader.readAsArrayBuffer(file);
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Top Slim Header */}
                    <nav className="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between sticky top-0 z-50 card-shadow">
                        <div className="flex items-center gap-4">
                            <div className="bg-indigo-600 p-1.5 rounded-lg text-white">
                                <Icon name="LayoutDashboard" className="w-5 h-5"/>
                            </div>
                            <h1 className="text-sm font-black tracking-tight uppercase leading-none">
                                ARGUS <span className="text-indigo-600">CORE</span>
                                <span className="ml-2 text-[10px] text-slate-400 font-bold border border-slate-100 px-1 rounded">v5.6</span>
                            </h1>
                        </div>

                        <div className="flex items-center gap-2">
                            {currentView === 'dashboard' && (
                                <div className="flex items-center gap-2">
                                    <div className="relative group">
                                        <Icon name="Search" className="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400"/>
                                        <input 
                                            type="text" 
                                            placeholder="Buscar..." 
                                            className="pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium w-40 md:w-60 focus:w-80 transition-all outline-none focus:ring-2 focus:ring-indigo-500/20"
                                            value={searchTerm}
                                            onChange={e => setSearchTerm(e.target.value)}
                                        />
                                    </div>
                                    <select 
                                        className="bg-white border border-slate-200 rounded-lg text-xs font-bold px-2 py-1.5 outline-none cursor-pointer hover:bg-slate-50"
                                        value={selectedProduct}
                                        onChange={e => setSelectedProduct(e.target.value)}
                                    >
                                        {products.map(p => <option key={p} value={p}>{p}</option>)}
                                    </select>
                                </div>
                            )}
                            <button 
                                onClick={() => setCurrentView(currentView === 'dashboard' ? 'settings' : 'dashboard')}
                                className={`p-2 rounded-lg transition-colors ${currentView === 'settings' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:bg-slate-50'}`}
                            >
                                <Icon name="Settings" className="w-5 h-5"/>
                            </button>
                        </div>
                    </nav>

                    <main className="flex-grow p-4 md:p-6 space-y-4 max-w-[1600px] mx-auto w-full">
                        {currentView === 'dashboard' ? (
                            <div className="grid grid-cols-12 gap-4">
                                {/* Metrics Bar */}
                                <div className="col-span-12 grid grid-cols-1 md:grid-cols-4 gap-4">
                                    <div className="bg-white p-4 rounded-xl border border-slate-200 card-shadow flex items-center justify-between">
                                        <div>
                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Entregas Ciclo</p>
                                            <h3 className="text-2xl font-black text-slate-800 tracking-tighter">{stats.delivered}<span className="text-slate-300 mx-1 text-lg">/</span><span className="text-slate-400 text-lg">{stats.total}</span></h3>
                                        </div>
                                        <div className="text-right">
                                            <div className="inline-block px-2 py-1 bg-emerald-50 text-emerald-600 rounded-lg text-[10px] font-black border border-emerald-100">
                                                {Math.round(stats.progress)}%
                                            </div>
                                        </div>
                                    </div>
                                    <div className="bg-white p-4 rounded-xl border border-slate-200 card-shadow">
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Backlog Produto</p>
                                        <h3 className="text-2xl font-black text-slate-800 tracking-tighter">{backlogCount} <span className="text-xs text-slate-400 font-bold">ITENS</span></h3>
                                    </div>
                                    <div className="bg-indigo-600 p-4 rounded-xl shadow-lg shadow-indigo-100 flex items-center justify-between text-white">
                                        <div>
                                            <p className="text-[10px] font-black text-white/60 uppercase tracking-widest mb-1">Status Roadmap</p>
                                            <h3 className="text-xl font-black tracking-tighter">V.NEXT Ativo</h3>
                                        </div>
                                        <Icon name="Calendar" className="w-8 h-8 opacity-20"/>
                                    </div>
                                    <div className="bg-white p-4 rounded-xl border border-slate-200 card-shadow flex items-center gap-3">
                                        <div className="p-2 bg-slate-50 rounded-lg"><Icon name="Package" className="text-indigo-600"/></div>
                                        <div>
                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none mb-1">Abas Ativas</p>
                                            <p className="text-xs font-bold text-slate-700">{products.length - 1} Produtos</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Charts Row */}
                                <div className="col-span-12 lg:col-span-4 bg-white p-4 rounded-xl border border-slate-200 card-shadow h-[320px]">
                                    <h4 className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-4 flex items-center gap-2">
                                        <div className="w-1.5 h-1.5 rounded-full bg-indigo-500"></div> Distribuição Status
                                    </h4>
                                    <ResponsiveContainer width="100%" height="85%">
                                        <PieChart>
                                            <Pie 
                                                data={statusData} 
                                                cx="50%" cy="45%" innerRadius={50} outerRadius={70} 
                                                paddingAngle={5} dataKey="value" 
                                                onClick={d => d && setChartFilters({...chartFilters, status: chartFilters.status === d.name ? null : d.name})}
                                                className="cursor-pointer outline-none"
                                            >
                                                {statusData.map((e,i) => <Cell key={i} fill={STATUS_COLORS[e.name] || CHART_COLORS[i % CHART_COLORS.length]} fillOpacity={!chartFilters.status || chartFilters.status === e.name ? 1 : 0.25} />)}
                                            </Pie>
                                            <Tooltip contentStyle={{borderRadius:'10px', fontSize:'11px', border:'none', boxShadow:'0 4px 6px -1px rgb(0 0 0 / 0.1)'}} />
                                            <Legend verticalAlign="bottom" iconType="circle" wrapperStyle={{fontSize: '9px', fontWeight: 'bold', textTransform: 'uppercase'}} />
                                        </PieChart>
                                    </ResponsiveContainer>
                                </div>

                                <div className="col-span-12 lg:col-span-8 bg-white p-4 rounded-xl border border-slate-200 card-shadow h-[320px]">
                                    <h4 className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-4 flex items-center gap-2">
                                        <div className="w-1.5 h-1.5 rounded-full bg-emerald-500"></div> Top 8 Alocações Equipe
                                    </h4>
                                    <ResponsiveContainer width="100%" height="90%">
                                        <BarChart 
                                            data={filteredData.reduce((acc, item) => { 
                                                const found = acc.find(a => a.name === item.assignee);
                                                if(found) found.value++; else acc.push({name: item.assignee, value: 1});
                                                return acc;
                                            }, []).sort((a,b) => b.value - a.value).slice(0, 8)}
                                            onClick={s => s && s.activeLabel && setChartFilters({...chartFilters, assignee: chartFilters.assignee === s.activeLabel ? null : s.activeLabel})}
                                        >
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                            <XAxis dataKey="name" fontSize={9} fontWeight="900" axisLine={false} tickLine={false} tick={{fill: '#94a3b8'}} />
                                            <YAxis hide />
                                            <Tooltip cursor={{fill: '#f8fafc'}} contentStyle={{borderRadius:'10px', border:'none'}} />
                                            <Bar dataKey="value" radius={[4,4,0,0]} barSize={20}>
                                                {assigneeData.map((e,i) => <Cell key={i} fill="#6366f1" fillOpacity={!chartFilters.assignee || chartFilters.assignee === e.name ? 1 : 0.3} />)}
                                            </Bar>
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>

                                {/* Table Section - Fixed height with scroll */}
                                <div className="col-span-12 bg-white rounded-xl border border-slate-200 card-shadow overflow-hidden flex flex-col">
                                    <div className="px-4 py-3 border-b border-slate-50 bg-slate-50/30 flex justify-between items-center">
                                        <div className="flex items-center gap-2">
                                            <span className="text-[10px] font-black text-indigo-600 uppercase tracking-widest">Listagem Analítica</span>
                                            <div className="h-1 w-1 rounded-full bg-slate-300"></div>
                                            <span className="text-[10px] font-bold text-slate-400">{filteredData.length} Demandas</span>
                                        </div>
                                        { (searchTerm || chartFilters.status || chartFilters.assignee) && (
                                            <button 
                                                onClick={() => {setSearchTerm(''); setChartFilters({status:null, assignee:null}); setSelectedProduct('Todos');}}
                                                className="text-[9px] font-black text-indigo-600 uppercase flex items-center gap-1 hover:underline"
                                            >
                                                <Icon name="Refresh" className="w-2.5 h-2.5"/> Limpar Filtros
                                            </button>
                                        )}
                                    </div>
                                    <div className="overflow-auto max-h-[380px] custom-scrollbar">
                                        <table className="w-full text-left text-[11px] border-collapse relative">
                                            <thead className="bg-white/95 backdrop-blur sticky top-0 z-10 border-b border-slate-100 shadow-sm">
                                                <tr>
                                                    <th className="px-4 py-2.5 font-black text-slate-400 uppercase tracking-widest">Produto</th>
                                                    <th className="px-4 py-2.5 font-black text-slate-400 uppercase tracking-widest">Título da Demanda</th>
                                                    <th className="px-4 py-2.5 font-black text-slate-400 uppercase tracking-widest">Responsável</th>
                                                    <th className="px-4 py-2.5 font-black text-slate-400 uppercase tracking-widest text-center">Status</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {filteredData.map((item, i) => (
                                                    <tr key={i} className="hover:bg-indigo-50/30 transition-colors group">
                                                        <td className="px-4 py-2 font-black uppercase tracking-tighter text-slate-600">{item.product}</td>
                                                        <td className="px-4 py-2 font-semibold text-slate-800 group-hover:text-indigo-600 transition-colors truncate max-w-md">{item.title}</td>
                                                        <td className="px-4 py-2 font-black uppercase text-slate-400 text-[10px]">{item.assignee}</td>
                                                        <td className="px-4 py-2 text-center">
                                                            <span className={`px-2 py-0.5 rounded text-[9px] font-black border uppercase inline-block min-w-[90px] ${item.status === 'Entregue' ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-slate-50 text-slate-500 border-slate-200'}`}>
                                                                {item.status}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {filteredData.length === 0 && (
                                                    <tr><td colSpan="4" className="py-20 text-center text-slate-300 font-black uppercase tracking-widest">Sem registros</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* Settings - Compacted */
                            <div className="max-w-xl mx-auto py-10">
                                <div className="bg-white rounded-2xl border border-slate-200 card-shadow overflow-hidden">
                                    <div className="bg-slate-900 p-8 text-white flex items-center gap-4">
                                        <div className="bg-indigo-600 p-3 rounded-xl"><Icon name="Database" className="w-8 h-8"/></div>
                                        <div>
                                            <h2 className="text-xl font-black uppercase tracking-tight">Sincronização BI</h2>
                                            <p className="text-xs text-slate-400 font-bold uppercase tracking-widest">Motor de Importação XLSX</p>
                                        </div>
                                    </div>
                                    <div className="p-8 space-y-6">
                                        <label className="flex flex-col items-center justify-center border-2 border-dashed border-slate-200 rounded-2xl p-10 hover:border-indigo-400 hover:bg-indigo-50/30 transition-all cursor-pointer group relative">
                                            <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
                                            <Icon name="Upload" className="w-10 h-10 text-indigo-600 mb-4 group-hover:scale-110 transition-transform"/>
                                            <p className="font-black text-slate-700 uppercase tracking-tighter">Carregar Ficheiro Excel</p>
                                            <p className="text-[10px] text-slate-400 font-bold uppercase mt-1">Consolidação automática de abas</p>
                                        </label>

                                        {importMessage.text && (
                                            <div className={`p-4 rounded-xl text-[10px] font-black uppercase text-center border ${
                                                importMessage.type === 'error' ? 'bg-red-50 text-red-600 border-red-100' : 
                                                importMessage.type === 'success' ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-indigo-50 text-indigo-600 border-indigo-100'
                                            }`}>
                                                {importMessage.text}
                                            </div>
                                        )}

                                        <div className="bg-slate-50 rounded-xl p-4 flex justify-between items-center">
                                            <div className="flex items-center gap-2">
                                                <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Última Leitura</span>
                                            </div>
                                            <span className="text-xs font-bold text-slate-700">{lastSync}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="px-4 py-4 border-t border-slate-200 flex justify-between items-center text-[9px] font-black uppercase tracking-[0.3em] text-slate-300">
                        <div className="flex items-center gap-4">
                            <span>Argus Core BI Infrastructure</span>
                            <div className="h-3 w-px bg-slate-200"></div>
                            <span className="text-emerald-500">System Ready</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <span>V5.6.2 Stable Build</span>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
