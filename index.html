<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argus Core - Tech Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
                            400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
                            800: '#3730a3', 900: '#312e81', 950: '#0e0c2e',
                        },
                    }
                }
            }
        }
    </script>
    <!-- Bibliotecas Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6366f144; border-radius: 20px; }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .neon-border-rose { border-left: 4px solid #f43f5e; }
        .active-filter-ring {
            box-shadow: 0 0 0 2px #6366f1, 0 8px 32px 0 rgba(99, 102, 241, 0.2);
        }

        .kanban-column {
            min-width: 340px;
            max-width: 340px;
            height: 700px;
            display: flex;
            flex-direction: column;
        }
        
        .legend-item-clickable { cursor: pointer; transition: opacity 0.2s; }
        .legend-item-clickable:hover { opacity: 0.7; }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#0B0F1A] text-slate-900 dark:text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, 
            PieChart, Pie, Cell, LabelList 
        } = window.Recharts;

        const CHART_COLORS = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#0ea5e9'];

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Dashboard: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
                Settings: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
                Sun: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z" /></svg>,
                Moon: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>,
                Calendar: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2-2v12a2 2 0 002 2z" /></svg>,
                List: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>,
                Grid: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
                Search: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
                User: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
                Upload: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>,
                Tag: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" /></svg>,
                Close: <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
            };
            return icons[name] || <div>?</div>;
        };

        const initialData = [
            { id: '1', product: 'Argus Vision', title: 'Filtro Dinâmico de Convénio', status: 'Entregue', type: 'Feature', assignee: 'Nicollas-Lanzone', activityType: 'BackEnd', sprint: '20/03', endDate: '2026-03-24' },
            { id: '2', product: 'Argus Experience', title: 'IA Chatbot - Mockup Base', status: 'Planejado', type: 'Melhoria', assignee: 'oliveirafacc', activityType: 'FrontEnd', sprint: '20/03', endDate: '2026-03-25' },
            { id: '3', product: 'Follow-Up', title: 'Integração CRM Automática', status: 'Backlog', type: 'Feature', assignee: 'Markinjr92', activityType: 'BackEnd', sprint: 'Roadmap', endDate: '2026-04-15' },
            { id: '4', product: 'Argus Watch', title: 'Correção Erro de Leitos', status: 'Entregue', type: 'Bug', assignee: 'Markinjr92', activityType: 'BackEnd', sprint: '20/03', endDate: '2026-03-22' }
        ];

        function App() {
            const [isDark, setIsDark] = useState(true);
            const [currentView, setCurrentView] = useState('dashboard');
            const [viewMode, setViewMode] = useState('kanban');
            const [rawData, setRawData] = useState(initialData);
            const [selectedProduct, setSelectedProduct] = useState('Todos');
            const [selectedType, setSelectedType] = useState('Todos');
            const [selectedSprint, setSelectedSprint] = useState('Todos');
            const [searchTerm, setSearchTerm] = useState('');
            const [importMessage, setImportMessage] = useState({ type: '', text: '' });

            useEffect(() => {
                const root = window.document.documentElement;
                if (isDark) root.classList.add('dark');
                else root.classList.remove('dark');
            }, [isDark]);

            const parseDate = (dateVal) => {
                if (!dateVal) return null;
                let d;
                if (typeof dateVal === 'number') d = new Date(Math.round((dateVal - 25569) * 86400 * 1000));
                else d = new Date(dateVal);
                return isNaN(d.getTime()) ? null : d;
            };

            const formatDate = (dateVal) => {
                const d = parseDate(dateVal);
                if (!d) return "N/D";
                return d.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
            };

            const products = useMemo(() => ['Todos', ...new Set(rawData.map(d => d.product))], [rawData]);
            const types = useMemo(() => [...new Set(rawData.map(d => d.type || 'Indefinido'))], [rawData]);

            const filteredData = useMemo(() => {
                return rawData.filter(item => {
                    const matchProd = selectedProduct === 'Todos' || item.product === selectedProduct;
                    const matchSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchType = selectedType === 'Todos' || (item.type || 'Indefinido') === selectedType;
                    let matchSprint = true;
                    if (selectedSprint === 'Current') matchSprint = item.sprint && item.sprint.includes('20/03');
                    else if (selectedSprint === 'Next') matchSprint = item.status === 'Planejado';
                    else if (selectedSprint === 'Backlog') matchSprint = item.status.toLowerCase().includes('backlog');
                    return matchProd && matchSearch && matchType && matchSprint;
                });
            }, [rawData, selectedProduct, searchTerm, selectedType, selectedSprint]);

            const metrics = useMemo(() => {
                const now = new Date();
                const globalFilter = (d) => (selectedProduct === 'Todos' || d.product === selectedProduct);
                
                const currentItems = rawData.filter(d => globalFilter(d) && (d.sprint && d.sprint.includes('20/03')));
                const currentDelivered = currentItems.filter(d => d.status === 'Entregue').length;
                const currentOverdue = currentItems.filter(d => {
                    const ed = parseDate(d.endDate);
                    return d.status !== 'Entregue' && ed && ed < now;
                }).length;

                const nextItems = rawData.filter(d => globalFilter(d) && d.status === 'Planejado');
                const nextDelivered = nextItems.filter(d => d.status === 'Entregue').length;

                const backlogByProduct = products.filter(p => p !== 'Todos').map(p => ({
                    name: p,
                    count: rawData.filter(i => i.product === p && i.status.toLowerCase().includes('backlog')).length
                })).filter(p => p.count > 0).sort((a,b) => b.count - a.count);

                const productTypeMatrix = products.filter(p => p !== 'Todos').map(p => {
                    const row = { product: p };
                    types.forEach(t => row[t] = rawData.filter(i => i.product === p && (i.type || 'Indefinido') === t).length);
                    return row;
                });

                const typeCounters = types.map(t => ({
                    name: t,
                    count: filteredData.filter(d => (d.type || 'Indefinido') === t).length
                })).filter(t => t.count > 0).sort((a,b) => b.count - a.count);

                const statusNames = [...new Set(rawData.map(d => d.status))];
                const statusCounters = statusNames.map(s => ({
                    name: s,
                    count: filteredData.filter(d => d.status === s).length
                })).filter(s => s.count > 0).sort((a,b) => b.count - a.count);

                return {
                    current: { total: currentItems.length, delivered: currentDelivered, pending: currentItems.length - currentDelivered, overdue: currentOverdue, perc: currentItems.length > 0 ? (currentDelivered / currentItems.length) * 100 : 0 },
                    next: { total: nextItems.length, delivered: nextDelivered, pending: nextItems.length - nextDelivered, perc: nextItems.length > 0 ? (nextDelivered / nextItems.length) * 100 : 0 },
                    backlog: { total: rawData.filter(d => globalFilter(d) && d.status.toLowerCase().includes('backlog')).length, items: backlogByProduct },
                    productTypeMatrix, typeCounters, statusCounters
                };
            }, [rawData, selectedProduct, filteredData, products, types]);

            const typeDataForChart = useMemo(() => {
                const baseData = rawData.filter(d => selectedProduct === 'Todos' || d.product === selectedProduct);
                const totalCount = baseData.length;
                const counts = baseData.reduce((acc, item) => {
                    const t = item.type || 'Indefinido';
                    acc[t] = (acc[t] || 0) + 1;
                    return acc;
                }, {});
                return Object.entries(counts).map(([name, value]) => ({ 
                    name, 
                    value, 
                    percentage: totalCount > 0 ? ((value / totalCount) * 100).toFixed(1) : 0 
                }));
            }, [rawData, selectedProduct]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setImportMessage({ type: 'info', text: 'Sincronizando...' });
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        let allItems = [];
                        workbook.SheetNames.forEach(name => {
                            const ws = workbook.Sheets[name];
                            const json = XLSX.utils.sheet_to_json(ws);
                            allItems = [...allItems, ...json.map((row, idx) => ({
                                id: `${name}-${idx}-${Date.now()}`,
                                title: row.Title || row.Demanda || row.Nome || 'Sem Nome',
                                status: row.Status || 'Backlog',
                                assignee: row.Assignees || row.Responsável || 'Indefinido',
                                product: row.Produto || row.Product || name,
                                type: row['Tipo de Entrega'] || row.Tipo || 'Feature',
                                activityType: row['Tipo de Atividade'] || row['Tipo Atividade'] || '--',
                                sprint: String(row['Sprint Release'] || row.Sprint || 'Roadmap'),
                                endDate: row['Data Fim Previsto'] || row.EndDate || null
                            })).filter(i => i.title !== 'Sem Nome')];
                        });
                        setRawData(allItems);
                        setImportMessage({ type: 'success', text: 'Dados Importados!' });
                        setTimeout(() => setCurrentView('dashboard'), 800);
                    } catch (err) { setImportMessage({ type: 'error', text: 'Erro no processamento.' }); }
                };
                reader.readAsArrayBuffer(file);
            };

            const BarValueLabel = ({ x, y, width, height, value }) => (
                value > 0 ? (
                    <text x={x + width / 2} y={y - 8} fill={isDark ? "#94a3b8" : "#64748b"} textAnchor="middle" fontSize={10} fontWeight="800">
                        {value}
                    </text>
                ) : null
            );

            const handleLegendClick = (data) => {
                const type = data.value || data.payload.name;
                setSelectedType(prev => prev === type ? 'Todos' : type);
            };

            return (
                <div className="flex flex-col min-h-screen">
                    <nav className="sticky top-0 z-50 glass border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center gap-6 cursor-pointer" onClick={() => { setCurrentView('dashboard'); setSelectedSprint('Todos'); setSelectedType('Todos'); }}>
                            <div className="w-10 h-10 bg-brand-600 rounded-2xl flex items-center justify-center shadow-lg shadow-brand-500/20">
                                <Icon name="Dashboard" className="text-white w-6 h-6" />
                            </div>
                            <div className="leading-none">
                                <h1 className="text-xl font-black tracking-tighter uppercase dark:text-white italic">ARGUS<span className="text-brand-500 not-italic">CORE</span></h1>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Operational BI v7.6</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-4">
                            <select className="bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-xs font-black px-4 py-2.5 outline-none cursor-pointer dark:text-slate-300 shadow-sm" value={selectedProduct} onChange={e => setSelectedProduct(e.target.value)}>
                                {products.map(p => <option key={p} value={p}>{p}</option>)}
                            </select>
                            <button onClick={() => setIsDark(!isDark)} className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 text-slate-500 hover:text-brand-500 transition-colors shadow-sm">
                                <Icon name={isDark ? "Sun" : "Moon"} />
                            </button>
                            <button onClick={() => setCurrentView('settings')} className="p-2.5 rounded-xl bg-brand-600 text-white shadow-lg">
                                <Icon name="Settings" />
                            </button>
                        </div>
                    </nav>

                    <main className="flex-grow max-w-[1750px] mx-auto w-full p-6 space-y-10 fade-in">
                        {currentView === 'dashboard' ? (
                            <div className="space-y-10">
                                {/* SEÇÃO 1: RESUMO EXECUTIVO (SPRINTS) */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div onClick={() => setSelectedSprint('Current')} className={`glass p-6 rounded-[2.5rem] neon-border-indigo cursor-pointer transition-all ${selectedSprint === 'Current' ? 'active-filter-ring' : ''}`}>
                                        <p className="text-[10px] font-black text-emerald-500 uppercase tracking-[0.2em] mb-1">CICLO ATUAL</p>
                                        <h3 className="text-2xl font-black dark:text-white tracking-tighter mb-4">Entregas 20/03</h3>
                                        <div className="space-y-2">
                                            <div className="flex justify-between items-end">
                                                <span className="text-4xl font-black text-emerald-500">{Math.round(metrics.current.perc)}%</span>
                                                <span className="text-xs font-bold opacity-40 uppercase tracking-widest">{metrics.current.delivered}/{metrics.current.total}</span>
                                            </div>
                                            <div className="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                                                <div className="h-full bg-emerald-500" style={{width: `${metrics.current.perc}%`}}></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div onClick={() => setSelectedSprint('Next')} className={`glass p-6 rounded-[2.5rem] neon-border-indigo cursor-pointer transition-all ${selectedSprint === 'Next' ? 'active-filter-ring' : ''}`}>
                                        <p className="text-[10px] font-black text-brand-500 uppercase tracking-[0.2em] mb-1">PRÓXIMA SPRINT</p>
                                        <h3 className="text-2xl font-black dark:text-white tracking-tighter mb-4">V.Next</h3>
                                        <div className="flex gap-4">
                                            <div className="flex-1 bg-brand-500/5 p-4 rounded-3xl border border-brand-500/10 text-center"><p className="text-[9px] font-black text-slate-400 uppercase">Total</p><p className="text-2xl font-black text-brand-500">{metrics.next.total}</p></div>
                                            <div className="flex-1 bg-emerald-500/5 p-4 rounded-3xl border border-emerald-500/10 text-center"><p className="text-[9px] font-black text-slate-400 uppercase">Prontas</p><p className="text-2xl font-black text-emerald-500">{metrics.next.delivered}</p></div>
                                        </div>
                                    </div>
                                    <div onClick={() => setSelectedSprint('Backlog')} className={`glass p-6 rounded-[2.5rem] neon-border-indigo cursor-pointer transition-all ${selectedSprint === 'Backlog' ? 'active-filter-ring' : ''}`}>
                                        <h3 className="text-2xl font-black dark:text-white tracking-tighter italic mb-4">Roadmap</h3>
                                        <div className="space-y-1 max-h-20 overflow-auto pr-1 custom-scrollbar">
                                            {metrics.backlog.items.map((b, i) => (
                                                <div key={i} className="flex justify-between text-[10px] font-bold py-1 border-b border-slate-100 dark:border-slate-800">
                                                    <span className="uppercase opacity-60 truncate">{b.name}</span><span className="text-brand-500">{b.count}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* SEÇÃO 2: ANÁLISE VISUAL (MATRIZ E PIZZA) */}
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                    <div className="lg:col-span-8 glass p-8 rounded-[3rem] neon-border-indigo shadow-sm overflow-hidden">
                                        <div className="mb-8">
                                            <p className="text-[10px] font-black text-brand-400 uppercase tracking-[0.2em] mb-1">BI: MULTI-BAR ANALYSIS</p>
                                            <h3 className="text-3xl font-black dark:text-white tracking-tighter">Produto x Tipo de Entrega</h3>
                                        </div>
                                        <div className="h-80 w-full">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <BarChart data={metrics.productTypeMatrix} margin={{top: 25, bottom: 20}}>
                                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={isDark ? '#ffffff10' : '#00000010'} />
                                                    <XAxis dataKey="product" fontSize={11} fontWeight="900" axisLine={false} tickLine={false} tick={{fill: isDark ? '#94a3b8' : '#64748b'}} />
                                                    <YAxis hide />
                                                    <Tooltip contentStyle={{background: isDark ? '#1e293b' : '#fff', border:'none', borderRadius:'12px', fontSize:'11px'}} />
                                                    <Legend iconType="circle" onClick={handleLegendClick} wrapperStyle={{fontSize:'10px', fontWeight:'900', textTransform:'uppercase', paddingTop:'40px'}} />
                                                    {types.map((type, idx) => (
                                                        <Bar key={type} dataKey={type} fill={CHART_COLORS[idx % CHART_COLORS.length]} radius={[4, 4, 0, 0]} barSize={10} hide={selectedType !== 'Todos' && selectedType !== type}>
                                                            <LabelList dataKey={type} content={<BarValueLabel />} />
                                                        </Bar>
                                                    ))}
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                    <div className="lg:col-span-4 glass p-8 rounded-[3rem] overflow-hidden">
                                        <p className="text-[10px] font-black text-brand-400 uppercase tracking-[0.2em] mb-1">PROPORÇÃO</p>
                                        <h3 className="text-2xl font-black dark:text-white tracking-tighter mb-4">Tipologia Geral</h3>
                                        <div className="h-64">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <PieChart>
                                                    <Pie 
                                                        data={typeDataForChart} 
                                                        cx="50%" 
                                                        cy="50%" 
                                                        innerRadius={50} 
                                                        outerRadius={80} 
                                                        paddingAngle={8} 
                                                        dataKey="value" 
                                                        label={({name, value, percentage}) => `${name}: ${value} (${percentage}%)`}
                                                        labelLine={true}
                                                    >
                                                        {typeDataForChart.map((e,i) => (<Cell key={i} fill={CHART_COLORS[i % CHART_COLORS.length]} stroke="none" opacity={selectedType === 'Todos' || selectedType === e.name ? 1 : 0.3} />))}
                                                    </Pie>
                                                    <Tooltip contentStyle={{background: isDark ? '#1e293b' : '#fff', border:'none', borderRadius:'12px'}} />
                                                </PieChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                </div>

                                {/* SEÇÃO 3: CONTADORES RÁPIDOS */}
                                <div className="space-y-6">
                                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">
                                        {metrics.typeCounters.map((item, idx) => (
                                            <div key={idx} onClick={() => setSelectedType(prev => prev === item.name ? 'Todos' : item.name)} className={`glass p-4 rounded-3xl border-l-4 shadow-sm cursor-pointer transition-all hover:scale-105 ${selectedType === item.name ? 'ring-2 ring-brand-500' : ''}`} style={{ borderLeftColor: CHART_COLORS[idx % CHART_COLORS.length] }}>
                                                <div className="flex items-center gap-2 mb-1 opacity-40"><Icon name="Tag" className="w-3 h-3" /><p className="text-[8px] font-black uppercase truncate">{item.name}</p></div>
                                                <p className="text-2xl font-black dark:text-white leading-none">{item.count}</p>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                        {metrics.statusCounters.map((item, idx) => (
                                            <div key={idx} className="glass p-4 rounded-3xl border-l-4 border-slate-300 dark:border-slate-700 shadow-sm">
                                                <div className="flex items-center gap-2 mb-1 opacity-40"><Icon name="List" className="w-3 h-3" /><p className="text-[8px] font-black uppercase truncate">{item.name}</p></div>
                                                <p className="text-2xl font-black dark:text-white leading-none">{item.count}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* SEÇÃO 4: DRILL-DOWN (KANBAN / LISTA) */}
                                <div className="space-y-8 pt-10 border-t border-slate-200 dark:border-slate-800">
                                    <div className="flex flex-col md:flex-row justify-between items-center gap-6 px-4">
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 bg-brand-600 rounded-[1.2rem] flex items-center justify-center text-white shadow-xl shadow-brand-600/20"><Icon name={viewMode === 'kanban' ? "Grid" : "List"} className="w-6 h-6" /></div>
                                            <div><h3 className="text-3xl font-black dark:text-white uppercase tracking-tighter italic">Drill-Down</h3><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Vista Operacional de Entregas</p></div>
                                        </div>
                                        <div className="flex items-center gap-3 w-full md:w-auto">
                                            <div className="bg-slate-100 dark:bg-slate-900 p-1.5 rounded-2xl flex gap-1 shadow-sm border border-slate-200 dark:border-slate-800">
                                                <button onClick={() => setViewMode('kanban')} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all flex items-center gap-2 ${viewMode === 'kanban' ? 'bg-white dark:bg-slate-800 dark:text-white shadow-md' : 'text-slate-400 hover:text-slate-600'}`}><Icon name="Grid" className="w-3.5 h-3.5" /> Kanban</button>
                                                <button onClick={() => setViewMode('list')} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all flex items-center gap-2 ${viewMode === 'list' ? 'bg-white dark:bg-slate-800 dark:text-white shadow-md' : 'text-slate-400 hover:text-slate-600'}`}><Icon name="List" className="w-3.5 h-3.5" /> Lista</button>
                                            </div>
                                            <div className="relative flex-grow md:flex-grow-0">
                                                <Icon name="Search" className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                                                <input type="text" placeholder="Pesquisar..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="pl-11 pr-4 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[1.2rem] text-xs font-bold w-full md:w-64 outline-none focus:ring-2 focus:ring-brand-500/20 shadow-sm" />
                                            </div>
                                        </div>
                                    </div>

                                    {viewMode === 'kanban' ? (
                                        <div className="flex gap-6 overflow-x-auto pb-8 custom-scrollbar px-2">
                                            {products.filter(p => p !== 'Todos').map((prod, pIdx) => {
                                                const items = filteredData.filter(i => i.product === prod);
                                                if (selectedProduct !== 'Todos' && selectedProduct !== prod) return null;
                                                return (
                                                    <div key={pIdx} className="kanban-column">
                                                        <div className="flex items-center justify-between px-5 py-5 bg-white dark:bg-slate-900 rounded-[1.8rem] border border-slate-200 dark:border-slate-800 shadow-lg mb-4 sticky top-0 z-20">
                                                            <div className="flex flex-col"><h4 className="text-xs font-black uppercase tracking-tighter dark:text-white truncate max-w-[180px] leading-none mb-1">{prod}</h4><span className="text-[8px] font-black text-slate-400 uppercase tracking-widest">Produto Ativo</span></div>
                                                            <span className="text-[10px] font-black bg-brand-500/10 text-brand-500 px-3 py-1.5 rounded-xl border border-brand-500/20">{items.length}</span>
                                                        </div>
                                                        <div className="flex flex-col gap-4 flex-grow overflow-y-auto pr-2 custom-scrollbar">
                                                            {items.map((item, iIdx) => {
                                                                const dt = parseDate(item.endDate);
                                                                const isOverdue = item.status !== 'Entregue' && dt && dt < new Date();
                                                                return (
                                                                    <div key={iIdx} className={`glass p-6 rounded-[2.2rem] border-l-4 shadow-md group hover:scale-[1.02] transition-all relative ${isOverdue ? 'neon-border-rose bg-red-500/5' : 'border-slate-200 dark:border-slate-800'}`}>
                                                                        <div className="flex justify-between items-start mb-4">
                                                                            <span className={`text-[8px] font-black uppercase px-2.5 py-1 rounded-lg border ${item.status === 'Entregue' ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' : 'bg-brand-500/10 text-brand-500 border-brand-500/20'}`}>{item.status}</span>
                                                                            <div className="flex flex-col items-end"><span className="text-[8px] font-bold text-slate-400 tracking-widest uppercase mb-0.5">{item.sprint}</span><div className="flex items-center gap-1 text-brand-500 font-black text-[9px]"><Icon name="Calendar" className="w-3 h-3" />{formatDate(item.endDate)}</div></div>
                                                                        </div>
                                                                        <h5 className="text-[12px] font-extrabold dark:text-white mb-5 line-clamp-3 leading-snug group-hover:text-brand-500 transition-colors">{item.title}</h5>
                                                                        <div className="pt-5 border-t border-slate-100 dark:border-slate-800/50 flex justify-between items-center">
                                                                            <div className="flex items-center gap-2.5"><div className="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center border border-slate-200 dark:border-slate-700"><Icon name="User" className="w-3.5 h-3.5 text-slate-400" /></div><span className="text-[9px] font-black uppercase text-slate-500 leading-none">{item.assignee}</span></div>
                                                                            <span className="text-[9px] font-black text-brand-500/70 italic uppercase">{item.type}</span>
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        <div className="space-y-4 px-2">
                                            {products.filter(p => p !== 'Todos').map((prod, pIdx) => {
                                                const items = filteredData.filter(i => i.product === prod);
                                                if (selectedProduct !== 'Todos' && selectedProduct !== prod) return null;
                                                if (items.length === 0) return null;
                                                return (
                                                    <div key={pIdx} className="glass rounded-[2rem] overflow-hidden shadow-sm border border-slate-200 dark:border-slate-800">
                                                        <div className="px-6 py-4 bg-slate-50/50 dark:bg-slate-900/50 flex items-center justify-between border-b border-slate-200 dark:border-slate-800">
                                                            <div className="flex items-center gap-3"><div className="w-8 h-8 rounded-xl bg-brand-500 flex items-center justify-center text-white font-black text-[10px]">{prod.charAt(0)}</div><h4 className="text-sm font-black uppercase dark:text-white tracking-tight">{prod}</h4></div>
                                                            <span className="text-[10px] font-black text-slate-400 uppercase">{items.length} ITENS</span>
                                                        </div>
                                                        <div className="overflow-x-auto"><table className="w-full text-left"><thead className="bg-slate-50 dark:bg-slate-950/30"><tr className="text-[9px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 dark:border-slate-800"><th className="px-6 py-4">Demanda</th><th className="px-6 py-4">Dono</th><th className="px-6 py-4 text-center">Status</th><th className="px-6 py-4 text-center">Data</th><th className="px-6 py-4 text-right">Sprint</th></tr></thead><tbody className="divide-y divide-slate-100 dark:divide-slate-800/50">{items.map((item, iIdx) => (<tr key={iIdx} className="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors group"><td className="px-6 py-4 max-w-md"><p className="text-xs font-bold dark:text-slate-200 group-hover:text-brand-500 truncate">{item.title}</p><p className="text-[9px] text-slate-400 uppercase mt-1">{item.type} · {item.activityType}</p></td><td className="px-6 py-4"><span className="text-[10px] font-black text-slate-500 uppercase">{item.assignee}</span></td><td className="px-6 py-4 text-center"><span className={`px-2 py-0.5 rounded text-[8px] font-black uppercase border ${item.status === 'Entregue' ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' : 'bg-brand-500/10 text-brand-500 border-brand-500/20'}`}>{item.status}</span></td><td className="px-6 py-4 text-center"><span className="text-[10px] font-bold text-brand-500">{formatDate(item.endDate)}</span></td><td className="px-6 py-4 text-right"><span className="text-[10px] font-mono font-bold text-slate-400">{item.sprint}</span></td></tr>))}</tbody></table></div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div className="max-w-3xl mx-auto py-12">
                                <div className="glass rounded-[3rem] overflow-hidden shadow-2xl">
                                    <div className="p-12 bg-brand-600 text-white"><h2 className="text-4xl font-black uppercase tracking-tighter italic">Data Engine</h2><p className="text-brand-100 text-sm font-bold tracking-widest opacity-80 uppercase">Importação de BI v7.6</p></div>
                                    <div className="p-12 space-y-10">
                                        <label className="group flex flex-col items-center justify-center border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-[3rem] p-16 hover:border-brand-500 cursor-pointer relative bg-white/30 dark:bg-slate-900/30 transition-all">
                                            <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer z-20" />
                                            <div className="w-24 h-24 bg-brand-600 text-white rounded-[2rem] flex items-center justify-center mb-6 group-hover:scale-110 transition-transform"><Icon name="Upload" className="w-10 h-10" /></div>
                                            <p className="text-2xl font-black text-slate-800 dark:text-white uppercase tracking-tighter">Sincronizar XLSX</p>
                                        </label>
                                        {importMessage.text && <div className="p-6 rounded-3xl text-[11px] font-black uppercase text-center border bg-brand-50 text-brand-600 dark:bg-brand-500/10 border-brand-100 dark:border-brand-500/20">{importMessage.text}</div>}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="px-6 py-10 border-t border-slate-200 dark:border-slate-800 text-center">
                        <p className="text-[9px] font-black uppercase tracking-[0.5em] text-slate-400">Argus BI Infrastructure • Operational Intelligence Engine • v7.6.1 Percentages</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
